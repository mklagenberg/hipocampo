manifest_version: '1.0'
skill:
  name: hipocampo
  version: 2.1.0
  release_status: immutable-release-target
  core_path: skill/
  source_repository: https://github.com/mklagenberg/hipocampo
  candidate_base_commit: 69810b92bda79d1a54457954c3286c1192f119ec
  source_commit: null
  package_lock: skill/package-lock.yaml
  provenance_note: Resolve the selected source to its exact commit and verify the
    full distribution inventory. Stable requires the immutable published release;
    explicit experimental execution permits a pinned snapshot or RC tag without a
    GitHub Release. source_commit remains external to avoid self-reference.
methodology:
  compatibility: ^3.0.0
  baseline_contract: 3.0.0
adapters:
- target: claude
  version: 1.0.0
  package: portable instructions plus separately installed local CLI runtime; host
    loading/operation must be observed
  verification_status: not-assessed
- target: chatgpt
  version: 1.0.0
  package: host-side deployment is separate; runtime conformance is not assessed by
    this portable package
  verification_status: not-assessed
- target: gemini
  version: 1.0.0
  package: host-side deployment is separate; runtime conformance is not assessed by
    this portable package
  verification_status: not-assessed
- target: github-copilot
  version: 1.0.0
  package: portable instructions plus separately installed local CLI runtime; host
    loading/operation must be observed
  verification_status: not-assessed
- target: codex
  version: 2.0.0
  package: portable instructions plus separately installed local CLI runtime; host
    loading/operation must be observed
  verification_status: instructions-only
updates:
  availability_manifest: https://github.com/mklagenberg/hipocampo/blob/main/skill/manifest.yaml
  immutable_package: https://github.com/mklagenberg/hipocampo/tree/v3.1.0/skill/
  release_ref: v3.1.0
  package_lock: skill/package-lock.yaml
  package_hash_algorithm: sha256
  advisories: https://github.com/mklagenberg/hipocampo/blob/main/CHANGELOG.md (a formal
    security advisory channel does not exist yet — see ROADMAP.md)
  check_on_first_activation: true
  normal_ttl: P7D
  security_ttl: P1D
  self_modify: false
runtime:
  version: 1.0.0
  entrypoint: scripts/v3_runtime.py
  installer: scripts/v3_distribution.py
  dependency_file: requirements-runtime.txt
  channels:
  - stable
  - experimental
  host_evidence: external final receipt; not-assessed entries remain unverified
  required_host_modes:
  - claude-code-local
  - github-copilot-agent-local
  - codex-local-cli
