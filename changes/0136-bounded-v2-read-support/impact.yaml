change_set:
  id: 0136-bounded-v2-read-support
  class: normative
  semver: minor
  status: proposed
  backfill: false
  decisions:
  - decisions/0121-general-compatibility-and-bounded-read-support.md
impact:
- artifact: .github/workflows/validate.yml
  status: updated
  note: Run the bounded V2 read regression in PR validation.
- artifact: SPEC.md, OPERATION-SUPPORT.yaml, docs/legacy-read-support.md
  status: updated
  note: Define the general compatibility boundary and exact V2 read support contract.
- artifact: COMPATIBILITY.yaml
  status: reviewed
  note: The V3 general range and state vocabulary stay unchanged; operation support is separate.
- artifact: docs/taxonomy.md, docs/vocabulary-dictionary.md
  status: updated
  note: Register the distinct concepts and controlled evidence terms.
- artifact: skill/SKILL.md, skill/references/v3-operation.md, skill/references/legacy-read.md, skill/package-lock.yaml
  status: updated
  note: Route a V2 read to its bounded procedure and update the locked package inventory.
- artifact: docs/v3-skill-conformance-ai-review.yaml
  status: updated
  note: Bind the review routing to the new package lock; this is not an approval receipt.
- artifact: scripts/v2_legacy_reader.py, scripts/validate_v2_legacy_reader.py
  status: updated
  note: Add a side-effect-free parser and synthetic positive/negative release cases.
- artifact: docs/host-installation.md, README.md, UPGRADE.md, MIGRATIONS.md, CHANGELOG.md
  status: updated
  note: Explain host loading, independent updates, warnings and migration boundary.
- artifact: docs/legacy-read-parity.md
  status: updated
  note: Compare the shared semantic and deterministic cases and retain open Search, transport and host gaps.
- artifact: decisions/0121-general-compatibility-and-bounded-read-support.md
  status: updated
  note: Record the accepted structural distinction and its constraints.
- artifact: scaffold, real vaults, host installations
  status: not-applicable
  note: No instance schema, vault data or host installation is changed by this candidate.
validation:
  commands:
  - python scripts/validate_v2_legacy_reader.py
  - python scripts/validate_hipocampo.py --root .
  - python scripts/validate_skill_docs.py --root .
  - python scripts/validate_skill_package.py --root .
  - python scripts/validate_compatibility.py --root . --channel experimental
  - python scripts/validate_contracts.py --root .
  - python scripts/validate_change.py --root .
  evidence:
  - changes/0136-bounded-v2-read-support/proposal.md
  notes: Synthetic parser and contract checks only; GitHub MCP, host and real vault reads require separate observation.
