    note: "New Decision Records, both Status: Accepted."
  - artifact: "decisions/0026-account-vs-opinion-in-corporate-instance.md, decisions/0027-promote-depromote-redbutton.md, decisions/0028-broadened-trigger-2a-remediation.md, decisions/0029-repository-type-taxonomy.md, decisions/0030-promote-same-domain-graduation.md, decisions/0031-change-set-mechanism.md"
