change_set:
  id: "0125-v3-coverage-gap-scenarios"
  class: "operational"
  semver: "none"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0093-v3-capability-and-revocation-boundary.md"
    - "decisions/0099-v3-migration-fixture-gate.md"
    - "decisions/0104-v3-logical-engine-organization.md"
    - "decisions/0115-isolated-v3-skill-candidate.md"

impact:
  - artifact: "scripts/v3_search_engine.py, scripts/v3_migration_engine.py, scripts/v3_case_bindings.py, scripts/validate_v3_coverage_gap_scenarios.py, scripts/validate_v3_engine_catalog.py, scripts/validate_v3_engine_suite.py, docs/v3-f0-script-classification.yaml"
    status: "updated"
    note: "Enforces the existing restricted-Chunk and fail-closed interrupted-preflight boundaries and executes the new per-scenario checks in the integrated suite."
  - artifact: "docs/v3-coverage-gap-scenarios.yaml, docs/v3-coverage-gap-semantic-review.yaml, docs/v3-migration-fixtures.yaml, docs/engines/test-matrix.yaml, docs/engines/deterministic-case-bindings.yaml, docs/engines/catalog.md"
    status: "updated"
    note: "Adds six synthetic deterministic scenarios and three additive semantic assessments without changing the historical 33-case review baseline."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "Corrects the candidate review count and records the new V3 coverage scenarios and their limits."
  - artifact: "SPEC.md, docs/v3-search-progressive-disclosure-contract.md, docs/v3-contract.md, decisions/0099-v3-migration-fixture-gate.md, candidates/skill-v3/"
    status: "reviewed"
    note: "Existing candidate contracts and instructions already define the tested boundaries; candidate package content and lock remain unchanged."
  - artifact: "skill/, COMPATIBILITY.yaml, knowledge_vaults/, private/"
    status: "not-applicable"
    note: "No published V2 skill, active compatibility tuple, real vault, or private capture was changed or accessed."

validation:
  commands:
    - "python -B scripts/validate_v3_coverage_gap_scenarios.py --root ."
    - "python -B scripts/validate_v3_engine_suite.py --root ."
    - "python -B scripts/validate_v3_search_progressive_disclosure.py --root ."
    - "python -B scripts/validate_v3_migration.py"
    - "python -B scripts/validate_v3_engine_catalog.py --root ."
    - "python -B scripts/validate_v3_skill_conformance.py --mode workflow --root ."
    - "python -B scripts/validate_skill_package.py --root ."
    - "python -B scripts/validate_skill_docs.py --root ."
    - "python -B scripts/validate_contracts.py --root ."
    - "python -B scripts/validate_hipocampo.py --root ."
    - "python -B scripts/validate_change.py --root . --base origin/main --head HEAD"
  evidence:
    - "docs/v3-coverage-gap-scenarios.yaml"
    - "docs/v3-coverage-gap-semantic-review.yaml"
    - "scripts/validate_v3_coverage_gap_scenarios.py"
  notes: "The workflow and release gates remain separate. Release validation is expected to remain blocked; semantic cases require human confirmation, and runtime authorization and migration recovery are not proven by these synthetic scenarios."
