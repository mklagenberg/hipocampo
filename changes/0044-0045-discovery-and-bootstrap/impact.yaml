change_set:
  id: "0044-0045-discovery-and-bootstrap"
  class: "normative"
  semver: "minor"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0044-vault-and-entity-discovery.md"
    - "decisions/0045-bootstrap-mechanic-and-profile-md.md"

impact:
  - artifact: "SPEC.md"
    status: "updated"
    note: "New section 12-A (vault/entity discovery) and 12-B (Bootstrap mechanic, profile.md schema). Section 2-C's forward reference to a future Decision Record now points at 12-A/decisions/0044. Section 5-D's mechanics list grows from three to four (Bootstrap). Section 12's multi-account-identity sentence updated to reflect discovery instead of a stored router."
  - artifact: "decisions/0044-vault-and-entity-discovery.md, decisions/0045-bootstrap-mechanic-and-profile-md.md"
    status: "updated"
    note: "New Decision Records, both Status: Accepted."
  - artifact: "docs/getting-started-non-technical.md, docs/invite-template.md"
    status: "updated"
    note: "New reference artifacts 8.3/8.4 from the taxonomy planning doc — conversational onboarding content consumed by Bootstrap's Orient action, and static invite text that triggers Bootstrap in a recipient."
  - artifact: "skill/references/personalization.md"
    status: "updated"
    note: "Rewritten — the repository-router and multi-account-identity tables are retired; the only thing that stays locally personalized is the bootstrap-seed pointer to the user's own anchor vault, explicitly flagged as an open item (name/location undesigned)."
  - artifact: "skill/references/instantiation.md"
    status: "updated"
    note: "New cross-reference paragraph placing this procedure as the Instantiate actions within the larger Bootstrap mechanic. The file's own worked example still uses pre-Lote-A domain/tier vocabulary — not touched by this Change Set, flagged in proposal.md's 'Known, not addressed here'."
  - artifact: "skill/SKILL.md"
    status: "updated"
    note: "Fixed a stale references/personalizacao.md path in the frontmatter description (should have pointed at the English canonical personalization.md since decisions/0034). 'Before first use' section rewritten for discovery instead of router-filling. New 'Discovering vaults and entities' and 'Bootstrap: first-time instantiation' sections. 'Instantiating a new vault' section gains a cross-reference to Bootstrap."
  - artifact: "scaffold/skeleton/POST-INSTANTIATION.md"
    status: "updated"
    note: "Step 3 (skill installation confirmation) rewritten for discovery instead of router-table confirmation. Step 6 (hipocampo.yaml manifest confirmation) corrected from the stale instance.domain/instance.tier fields to instance.entity/instance.role/instance.tier, a Lote A propagation gap found and fixed while editing the same section (decisions/0041)."
  - artifact: "GETTING-STARTED.md"
    status: "updated"
    note: "Section 2 (instantiate a content repository): step 1 corrected from stale domain/deprecated-tier-value wording to the current entity/role/tier inputs the scaffold profiles actually declare (a Lote A propagation gap, same category as the POST-INSTANTIATION.md fix above); step 4's router-filling instruction replaced with a discovery pointer; intro paragraph and closing line gain a Bootstrap cross-reference for a genuine first-time user."
  - artifact: "docs/FUNDAMENTALS.md"
    status: "updated"
    note: "The 'Step by step: creating a repository from a template' section described a dead flow (hipocampo-toolkit's 'Use this template' button, consolidated and archived by decisions/0032 well before this Change Set) — replaced with a short description of the current agent-driven flow and a pointer to docs/getting-started-non-technical.md, rather than left describing a mechanism that no longer exists."
  - artifact: "moda.yaml"
    status: "updated"
    note: "Two new components (vault-discovery, bootstrap-mechanic) and two new reference/template components (onboarding-tutorial, invite-template). mechanics-taxonomy component source gains decisions/0045."
  - artifact: "conformance/moda.yaml"
    status: "updated"
    note: "decomposition_and_control_flow gains Bootstrap as a fourth mechanic with an explicitly specified trigger. distribution_of_agency gains the Interview action's gate and discovery's deterministic/discretionary classification as further worked examples — status stays partial, no single classification exists yet across every step in the methodology. packaging_and_synchronization notes the router's retirement as removing one local-drift surface, without resolving the control's broader gap. evolution gains decisions/0044-0045 as the third lote of the v2.0.0 taxonomy revision."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "New [Unreleased] entries for decisions/0044, decisions/0045, this Change Set, the two new docs/ artifacts, and every consumer-file update listed above."
  - artifact: "UPGRADE.md"
    status: "not-applicable"
    note: "Nothing here requires an existing instance to change anything to stay conformant — profile.md is new and opt-in, and discovery replaces a mechanism (the router table) that lived only in personal skill copies outside any content repository's own scope."
  - artifact: "MIGRATIONS.md"
    status: "not-applicable"
    note: "Minor-scope, additive change per decisions/0023's operational test — no existing instance becomes formally incompatible with no action. Does not touch the '1.x -> 2.0' section Lote A started."
  - artifact: "docs/change-management.md"
    status: "reviewed"
    note: "The regra_normativa and schema_frontmatter trigger definitions already cover what this Change Set fires — no change needed to the trigger table itself."
  - artifact: "docs/FAQ-AND-COMMON-ERRORS.md"
    status: "not-applicable"
    note: "Still describes the pre-decisions/0032 'Use this template' instantiation flow end to end — a real, pre-existing staleness independent of discovery/bootstrap specifically. Flagged in proposal.md's 'Known, not addressed here' rather than silently left inconsistent or opportunistically half-fixed."
  - artifact: "existing real vaults (hipocampo-personal-vault, hipocampo-concepts, hipocampo-company, hipocampo-company-vault)"
    status: "not-applicable"
    note: "Real content repositories are never edited from this repository (SPEC.md section 1). None of the four currently has a profile.md or runs discovery yet — adopting either is opportunistic, the same posture UPGRADE.md already takes toward every other optional capability."

validation:
  commands:
    - "python3 scripts/validate_hipocampo.py --root ."
  evidence:
    - "Run on the branch before opening the PR: see PR description for the actual output."
  notes: "This Change Set adds two new Decision Records (template-checked by validate_hipocampo.py) and two new SPEC.md sections with internal cross-references (link resolution also checked, including the new 12-a/12-b anchors). It does not touch document frontmatter (SPEC.md section 2) — the schema-field coverage report is unaffected, since profile.md is a separate schema, not a section-2 field. Semantic completeness of the discovery/no-sibling-graph design and the Bootstrap mechanic's action sequence remains human review, per docs/change-management.md's own stated limits."
