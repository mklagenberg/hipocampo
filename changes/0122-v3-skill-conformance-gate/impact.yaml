change_set:
  id: "0122-v3-skill-conformance-gate"
  class: "operational"
  semver: "none"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0114-v3-ai-first-skill-conformance-gate.md"

impact:
  - artifact: "docs/v3-skill-conformance-gate.md, docs/v3-skill-conformance-cases.yaml, docs/v3-skill-conformance-ai-review.yaml"
    status: "updated"
    note: "Defines AI-first and human-final V3 skill review, synthetic scenarios, and the current blocked assessment."
  - artifact: "scripts/validate_v3_skill_conformance.py, .github/workflows/validate.yml"
    status: "updated"
    note: "Validates deterministic compatibility outcomes, per-case AI evidence, package fingerprint, distinct AI review sessions and timestamped review order; CI checks workflow readiness."
  - artifact: "RELEASE-CHECKLIST.md, docs/change-management.md, CHANGELOG.md"
    status: "updated"
    note: "Adds the V3 skill conformance release gate and states that deterministic checks do not prove semantic truth."
  - artifact: "decisions/0114-v3-ai-first-skill-conformance-gate.md"
    status: "updated"
    note: "Records the accepted V3 skill review sequence and human decision boundary."
  - artifact: "SPEC.md, skill/, scaffold/, COMPATIBILITY.yaml, MIGRATIONS.md, UPGRADE.md"
    status: "reviewed"
    note: "The gate is added without claiming that the V3 skill package or methodology compatibility tuple has already been updated."
  - artifact: "knowledge_vaults/, private/"
    status: "not-applicable"
    note: "Only synthetic fixtures are used; no real vault is accessed."

validation:
  commands:
    - "python -B scripts/validate_v3_skill_conformance.py --root . --mode workflow"
    - "python -B scripts/validate_v3_skill_conformance.py --root . --mode release"
    - "python -B scripts/validate_skill_docs.py --root ."
    - "python -B scripts/validate_skill_package.py --root ."
    - "python -B scripts/validate_compatibility.py --root ."
    - "python -B scripts/validate_change.py --root ."
    - "python -B scripts/validate_hipocampo.py --root ."
    - "python -B scripts/validate_contracts.py --root ."
  evidence:
    - "docs/v3-skill-conformance-cases.yaml"
    - "docs/v3-skill-conformance-ai-review.yaml"
    - "scripts/validate_v3_skill_conformance.py"
  notes: "Workflow/spec validation must pass. Release mode is expected to block until a V3-compatible skill candidate has AI and human review."
