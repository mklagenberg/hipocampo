change_set:
  id: "0047-0048-taxonomy-map-and-step-classification"
  class: "operational"
  semver: "minor"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0047-taxonomy-map.md"
    - "decisions/0048-step-classification-scheme.md"

impact:
  - artifact: "docs/taxonomy.md"
    status: "updated"
    note: "New file. Current-state coverage complete for every controlled field and named concept; retroactive version lineage for anything predating v1.9.0 marked TBD — Lote E2, explicitly, not silently."
  - artifact: "docs/step-classification.md"
    status: "updated"
    note: "New file. Formalizes the deterministic/discretionary/gated scheme and classifies every currently-named routine, mechanic action, and failure-recovery mode against it."
  - artifact: "decisions/0047-taxonomy-map.md"
    status: "updated"
    note: "New Decision Record, Status: Accepted."
  - artifact: "decisions/0048-step-classification-scheme.md"
    status: "updated"
    note: "New Decision Record, Status: Accepted."
  - artifact: "SPEC.md"
    status: "updated"
    note: "Two pointer sentences added: section 2-C gains a 'Full taxonomy index' paragraph pointing to docs/taxonomy.md; section 5-D's four-layer-taxonomy paragraph now also cites docs/step-classification.md alongside the existing 'sections 8/14' reference. No rule content changed."
  - artifact: "moda.yaml"
    status: "updated"
    note: "New documentation entries (taxonomy_map, step_classification) and two new components (taxonomy-map, step-classification)."
  - artifact: "conformance/moda.yaml"
    status: "updated"
    note: "decomposition_and_control_flow gains docs/taxonomy.md and decisions/0047 as evidence, with a note on current-state-complete/retroactive-pending scope. distribution_of_agency gains docs/step-classification.md and decisions/0048 as evidence, with a note that this narrows but does not close the control's named gap (no mapping onto MODA's own five-value agency vocabulary attempted). evolution evidence gains decisions/0047-0048 as the fifth lote of the v2.0.0 taxonomy revision, itself split into two sub-lotes."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "New [Unreleased] entries for both new documents, both Decision Records, this Change Set, and every consumer-file update listed above."
  - artifact: "UPGRADE.md"
    status: "not-applicable"
    note: "No existing instance needs to change anything to stay conformant — both new documents are reference material about the hipocampo repository itself, not a schema or behavior change any content repository implements."
  - artifact: "MIGRATIONS.md"
    status: "not-applicable"
    note: "Minor-scope, purely additive change per decisions/0023's operational test."
  - artifact: "docs/vocabulary-dictionary.md"
    status: "reviewed"
    note: "docs/taxonomy.md explicitly points at this file instead of duplicating its pt-BR/English pairs — no edit needed to the dictionary itself."
  - artifact: "docs/evaluation-scenarios.md, docs/getting-started-non-technical.md, docs/invite-template.md"
    status: "not-applicable"
    note: "Unrelated reference documents, no cross-reference needed."
  - artifact: "skill/references/personalization.md, skill/SKILL.md, skill/references/instantiation.md, skill/references/routines.md"
    status: "reviewed"
    note: "No consumer-file edit needed. Neither new document changes agent behavior — both are reference material an operator or auditor consults, not operational guidance the skill executes against."
  - artifact: "scripts/validate_hipocampo.py"
    status: "not-applicable"
    note: "The validator's internal-link resolution already covers the new cross-references added in SPEC.md and the new files themselves (file existence, heading-anchor matching) — no change needed to the script for this Change Set to be checkable by it."
  - artifact: "existing real vaults (hipocampo-personal-vault, hipocampo-concepts, hipocampo-company, hipocampo-company-vault)"
    status: "not-applicable"
    note: "Real content repositories are never edited from this repository (SPEC.md section 1). Both new documents describe the hipocampo repository's own taxonomy, not vault content — no vault needs any change to remain conformant."

validation:
  commands:
    - "python3 scripts/validate_hipocampo.py --root ."
  evidence:
    - "Run on the branch before opening the PR: see PR description for the actual output."
  notes: "Two new Decision Records are template-checked by validate_hipocampo.py. The two new SPEC.md pointer sentences reference existing headings (SPEC.md#2-c, no new heading introduced) and the two new docs/ files by relative path — both checked by the validator's internal link resolution. This Change Set does not touch document frontmatter (SPEC.md section 2) — the schema-field coverage report is unaffected. Semantic completeness of docs/taxonomy.md's current-state rows and docs/step-classification.md's per-step classifications remains human review, per docs/change-management.md's own stated limits."
