change_set:
  id: "0134-v3-release-marker-reconciliation"
  class: "operational"
  semver: "patch"
  status: "proposed"
  backfill: false
  decisions:
    - "decisions/0023-operational-criterion-for-semver-scope.md"
impact:
  - artifact: "COMPATIBILITY.yaml, CHANGELOG.md, README.md, UPGRADE.md, MIGRATIONS.md, ROADMAP.md, SPEC-V2.2.md, SPEC.md, moda.yaml, conformance/moda.yaml"
    status: "updated"
    note: "Align current methodology/package tuple and release state with verified V3.0.0 publication and prepare the V3.0.1 PATCH follow-up."
  - artifact: "skill/SKILL.md, skill/manifest.yaml, skill/package-lock.yaml, skill/references/v3-operation.md, skill/references/codex.md, skill/references/instantiation.md, COMPATIBILITY.yaml"
    status: "updated"
    note: "Clarify source-snapshot release markers versus external publication proof; require an immutable GitHub Release, matching tag target, pinned commit and package hashes; retain authorization and capability gates."
  - artifact: "docs/v3-release-preparation.md, docs/v3-skill-conformance-gate.md, docs/v3-contract.md, docs/v3-correlation-contract.md, docs/v3-crud-events-contract.md, docs/v3-crud-governed-use-cases.md, docs/v3-documentation-architecture.md, docs/v3-external-reference-policy.md, docs/v3-language-policy.md, docs/v3-license-and-vault-privacy-contract.md, docs/v3-operational-events-contract.md, docs/v3-package-delivery-contract.md, docs/v3-revocation-contract.md, docs/v3-session-cache-contract.md, docs/v3-surface-authority-contract.md, docs/v3-vocabulary-and-aliases.md, docs/engines/catalog.md, docs/engines/learning-evolution.md, docs/taxonomy.md, docs/vocabulary-dictionary.md, RELEASE-CHECKLIST.md"
    status: "updated"
    note: "Close historical V3.0.0 publication wording and state the fresh-review gate for the changed package."
  - artifact: "docs/v3-skill-conformance-ai-review.yaml, docs/evidence/v3-skill-primary-2.0.1-marker-reconciliation-2026-10-15.json, docs/evidence/v3-skill-challenge-2.0.1-marker-reconciliation-2026-10-15.json"
    status: "updated"
    note: "Bind primary and independent challenge reviews to the exact new package fingerprint; retain the old 2.0.0 approval as historical and keep human approval pending."
  - artifact: "scaffold, runtime engines"
    status: "not-applicable"
    note: "No normative data contract, migration behavior, scaffold or runtime behavior changes."
  - artifact: "V3 skill conformance evidence, validation guard and release checklist"
    status: "reviewed"
    note: "Existing skill 2.0.0 evidence remains historical; new package fingerprint requires fresh AI review, independent challenge and human approval before release."
  - artifact: "scripts/validate_v3_skill_conformance.py"
    status: "updated"
    note: "Validation retains the accepted immutable-release requirement while checking the version-pinned source reference."
  - artifact: "scripts/validate_v3_release_regressions.py"
    status: "updated"
    note: "Synthetic complete-review fixture now supplies an independent passed challenge as well as the human decision, keeping the validator regression check executable while the real envelope remains blocked."
  - artifact: "scaffold/skeleton/POST-INSTANTIATION.md, scaffold/skeleton/POS-INSTANCIACAO.md"
    status: "updated"
    note: "Use the manifest-selected skill package version instead of hardcoding 2.0.0 and require immutable-release, target and lock verification."
validation:
  commands:
    - "python scripts/validate_hipocampo.py --root ."
    - "python scripts/validate_skill_docs.py --root ."
    - "python scripts/validate_skill_package.py --root ."
    - "python scripts/validate_contracts.py --root ."
    - "python scripts/validate_change.py --root ."
    - "python scripts/validate_v3_skill_conformance.py --root . --mode workflow"
    - "python scripts/validate_v3_skill_conformance.py --root . --mode release"
  evidence:
    - "changes/0134-v3-release-marker-reconciliation/proposal.md"
  notes: "Passing local validation does not publish v3.0.1 or prove any vault migration/runtime capability."
