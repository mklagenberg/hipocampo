change_set:
  id: "0050-ci-and-change-set-validation"
  class: "operational"
  semver: "minor"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0031-change-set-mechanism.md"
    - "decisions/0036-deterministic-validation-of-repository-structure.md"

impact:
  - artifact: ".github/workflows/validate.yml"
    status: "updated"
    note: "New file. Wires scripts/validate_hipocampo.py, scripts/validate_skill_docs.py, and scripts/validate_change.py (structural + diff-coverage mode) into CI on every PR against main and on push to main."
  - artifact: "scripts/validate_skill_docs.py"
    status: "updated"
    note: "New file. Checks skill/**.md's example/*.md output-path literals against scaffold/profiles/*.yaml's declared outputs, and flags any backtick-quoted domain: usage under skill/ (superseded field, decisions/0041)."
  - artifact: "scripts/validate_change.py"
    status: "updated"
    note: "New file. Structural schema validation of every changes/*/impact.yaml, with a frozen grandfather exemption for the six Change Sets that predate this validator (see proposal.md's Discarded alternatives), plus PR-mode diff-coverage checking."
  - artifact: "requirements-dev.txt"
    status: "updated"
    note: "New file. Pins PyYAML, scripts/validate_change.py's only third-party dependency."
  - artifact: "conformance/moda.yaml"
    status: "updated"
    note: "repository_contract and specification_driven_change_control controls corrected -- both previously cited this CI workflow as existing evidence before it existed in this repository; now list the real scripts and workflow file, with the diff-coverage check's heuristic (not semantic) nature made explicit. Status stays partial."
  - artifact: "docs/change-management.md"
    status: "updated"
    note: "'Impact status' section now notes the deterministic diff-coverage check exists (heuristic caveat); 'Change flow' step 7 mentions scripts/validate_change.py; new note under 'Triggers' clarifying impact.yaml has no literal triggers: field despite the table's prose; 'Deterministic and human checking' rewritten to describe all three scripts plus an explicit correction of the prior false CI claim; 'Completion rule' updated."
  - artifact: "skill/SKILL.md, skill/references/instantiation.md"
    status: "not-applicable"
    note: "Fixed under a separate, prior Change-Set-less PR (#42) as isolated editorial doc-bug fixes (wrong example filename, stale domain: vocabulary in a worked example) found during the same v2.0.0 personal-skill revalidation exercise that surfaced this Change Set's false-CI-claim finding -- no Change Set required per docs/change-management.md's class table."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "New [Unreleased] section with entries for this Change Set and every file listed above."
  - artifact: "UPGRADE.md"
    status: "not-applicable"
    note: "No existing content instance needs to change anything to stay conformant -- this is hipocampo repository-internal tooling, not a schema or behavior any content repository implements."
  - artifact: "MIGRATIONS.md"
    status: "not-applicable"
    note: "Additive, minor-scope change per decisions/0023's operational test."
  - artifact: "SPEC.md"
    status: "not-applicable"
    note: "No normative obligation added, removed, or changed."
  - artifact: "moda.yaml"
    status: "not-applicable"
    note: "No new component or documentation entry needed -- the underlying components (structural validation, Change Set mechanism) were already declared by decisions/0036 and decisions/0031's own Change Sets; conformance/moda.yaml's evidence updates already capture this one."

validation:
  commands:
    - "python3 scripts/validate_hipocampo.py --root ."
    - "python3 scripts/validate_skill_docs.py --root ."
    - "python3 scripts/validate_change.py --root ."
    - "python3 scripts/validate_change.py --root . --base <PR #43 base sha> --head <PR #43 head sha>"
  evidence:
    - "Local run against a clone of the PR #43 branch, after applying this Change Set's grandfather fix: all four commands pass with 0 errors (previously scripts/validate_change.py --root . failed with 25 errors across 6 pre-existing changes/*/impact.yaml files, before the fix in this Change Set)."
  notes: "First Change Set to be checked by its own diff-coverage mechanism (scripts/validate_change.py --base/--head) -- PR #43's protected-path changes (conformance/moda.yaml, docs/change-management.md) are covered by the 'updated' entries above."
