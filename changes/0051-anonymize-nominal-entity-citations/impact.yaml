change_set:
  id: "0051-anonymize-nominal-entity-citations"
  class: "operational"
  semver: "patch"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0050-no-nominal-entity-citation-in-methodology-repository.md"

impact:
  - artifact: "decisions/0050-no-nominal-entity-citation-in-methodology-repository.md"
    status: "updated"
    note: "New Decision Record. Establishes the standing, unconditional no-nominal-entity-citation rule this Change Set executes."
  - artifact: "docs/evaluation-scenarios.md"
    status: "updated"
    note: "Scenario 1: the real org/document path, the real colleague's quoted first name, and the real personal handle (two occurrences) redacted to their anonymized placeholders. Added a one-line note pointing to decisions/0050 confirming the case is still real, only the identifying tokens are redacted."
  - artifact: "decisions/0026-account-vs-opinion-in-corporate-instance.md"
    status: "updated"
    note: "Context section: same org/document-path and colleague-name substitutions as above, plus a second real document-path citation (appears twice: Context and Discarded alternatives), all redacted to anonymized placeholders. Added a redaction note under Context."
  - artifact: "decisions/0039-minimal-evaluation-scenarios.md"
    status: "updated"
    note: "Context, Decision item 1, and Rationale: the real personal handle and the real org/document-path citations (three occurrences total) redacted to anonymized placeholders. Added an inline cross-reference to decisions/0050."
  - artifact: "decisions/0024-upgrade-md-cumulative-checklist.md"
    status: "updated"
    note: "Context: the real employer-name parenthetical redacted to the anonymized placeholder (Acme), with a cross-reference to decisions/0050."
  - artifact: "skill/references/instantiation.md"
    status: "updated"
    note: "Worked example: the real employer name (used twice -- once in the User quote, once as the entity: value) redacted to the anonymized placeholder (Acme)."
  - artifact: "audits/moda/2026-08-17-v1.0.0-self-audit.md"
    status: "updated"
    note: "Frozen evidence, normally never edited in place (see docs/change-management.md). Narrow, logged exception: redacted the real personal handle and the real org/document-path citation in the Onda 4 action-plan line (section 6) to their anonymized placeholders, and appended a new, dated 'Nota de redação' after the existing 2026-08-17 freeze note, documenting that a redaction occurred and why, citing this Change Set and decisions/0050 -- without restating the original real terms. No other sentence in the audit's body was touched; findings, severities, and conclusions are unchanged."
  - artifact: "changes/0038-0039-failure-recovery-and-evaluation-scenarios/impact.yaml"
    status: "updated"
    note: "Accepted Change Set, normally never edited after acceptance (see docs/change-management.md). Narrow, logged exception: the artifact-path entry naming the real org/document path redacted to its anonymized placeholder, with an addendum appended to that entry's own note (not replacing the original note) documenting that a redaction occurred and why, dated, citing this Change Set and decisions/0050 -- without restating the original real term. The Change Set's classification, decisions, and every other entry are unchanged."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "New [Unreleased] entry documenting this Change Set and decisions/0050."
  - artifact: "conformance/moda.yaml"
    status: "not-applicable"
    note: "No MODA control's evidence changes -- this is a content correction inside already-declared evidence artifacts (an audit, a Change Set), not a new capability or a change in what any control covers."
  - artifact: "UPGRADE.md"
    status: "not-applicable"
    note: "No existing content instance needs to change anything to stay conformant -- this Change Set corrects the hipocampo repository's own reference text only."
  - artifact: "MIGRATIONS.md"
    status: "not-applicable"
    note: "Corrective, patch-scope change per decisions/0023's operational test -- no existing instance becomes incompatible."
  - artifact: "SPEC.md"
    status: "not-applicable"
    note: "No normative obligation added, removed, or changed."
  - artifact: "moda.yaml"
    status: "not-applicable"
    note: "No new component or documentation entry needed."

validation:
  commands:
    - "python3 scripts/validate_hipocampo.py --root ."
    - "python3 scripts/validate_skill_docs.py --root ."
    - "python3 scripts/validate_change.py --root ."
    - "Repository-wide case-insensitive search for the specific real terms this Change Set redacts, run locally at review time (not reproduced in this file, per decisions/0050) -- expected and confirmed: zero matches outside git history."
  evidence:
    - "Local run against this Change Set's branch: all three validator scripts pass with 0 errors (validate_hipocampo: 0 errors/0 warnings, schema field coverage 22/22; validate_skill_docs: 0 errors; validate_change: 16 Change Sets checked, 0 errors). The repository-wide search for the redacted real terms returned zero matches in the working tree."
  notes: "Neither this Change Set's proposal.md nor this impact.yaml restates the original real terms anywhere -- every note above describes what was redacted in the abstract (\"the real employer name\", \"the real colleague's quoted first name\", \"the real personal handle\") rather than quoting it, since quoting it here would itself be exactly the nominal citation decisions/0050 prohibits. The anonymized placeholders (Acme/org-acme, [Colleague], @personal-handle) are named directly throughout, since those are not real-entity citations."
