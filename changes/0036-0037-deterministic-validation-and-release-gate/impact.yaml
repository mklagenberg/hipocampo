change_set:
  id: "0036-0037-deterministic-validation-and-release-gate"
  class: "operational"
  semver: "minor"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0036-deterministic-validation-of-repository-structure.md"
    - "decisions/0037-minimal-release-gate-checklist.md"

impact:
  - artifact: "scripts/validate_hipocampo.py"
    status: "updated"
    note: "New file. Dependency-free Python script implementing the four checks described in decisions/0036."
  - artifact: ".github/workflows/validate.yml"
    status: "updated"
    note: "New file. Runs scripts/validate_hipocampo.py on every PR against main and on push to main."
  - artifact: "RELEASE-CHECKLIST.md"
    status: "updated"
    note: "New file. Minimal release-gate checklist per decisions/0037."
  - artifact: "SPEC.md"
    status: "updated"
    note: "Section 9 (Versioning) now points to scripts/validate_hipocampo.py and RELEASE-CHECKLIST.md as part of the release routine."
  - artifact: "README.md"
    status: "updated"
    note: "New doc-links entry for RELEASE-CHECKLIST.md."
  - artifact: "AGENTS.md (root)"
    status: "updated"
    note: "The working rule 'Prefer deterministic validation when it exists — today none exists for the methodology repository itself' was stale as of this Change Set; corrected to point to scripts/validate_hipocampo.py, with the remaining honest gap (Change Set semantic completeness, impact.yaml vs. actual diff) still named as human-only."
  - artifact: "docs/change-management.md"
    status: "updated"
    note: "'Deterministic and human checking' section rewritten: structural integrity is now deterministic and CI-enforced; classification truth, projection completeness, rationale credibility, and risk acceptability remain human review, unchanged."
  - artifact: "moda.yaml"
    status: "updated"
    note: "documentation block gains structural_validation and release_checklist entries; new components entry for the validation script."
  - artifact: "conformance/moda.yaml"
    status: "updated"
    note: "repository_contract control evidence/notes updated to reflect the new script, CI workflow, and RELEASE-CHECKLIST.md — status stays partial: MODA's full release-gate model and repository branch-protection enforcement remain out of scope, by design (decisions/0037)."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "New [Unreleased] entries for decisions/0036, decisions/0037, this Change Set, and the decisions/0034 and 0035 title-template fix (below)."
  - artifact: "ROADMAP.md"
    status: "updated"
    note: "'Now' status line updated to record Fase G as done; 'Next' section's 'Continuous deterministic validation' entry removed (implemented, folded into Now), with a note on what remains open (impact.yaml-vs-diff checking, quality/evaluation)."
  - artifact: "decisions/0034-repository-and-vault-language-policy.md, decisions/0035-controlled-vocabulary-dictionary.md"
    status: "updated"
    note: "Title lines corrected to the '# NNNN — Title' template (both were missing the leading DR number) — a real defect surfaced by testing decisions/0036's own validator against the actual repository, fixed in the same PR rather than left as a known failure of a brand-new check."
  - artifact: "hipocampo-toolkit (separate repository), existing real vaults"
    status: "not-applicable"
    note: "Both changes are internal to the hipocampo repository's own tooling; nothing here is consumed by a content instance or by the archived toolkit."

validation:
  commands:
    - "python3 scripts/validate_hipocampo.py --root ."
  evidence:
    - "Local run on the branch before opening the PR: 0 errors, 0 warnings, schema-field coverage 22/22 (see command above)."
    - "Manual fault-injection test (broken link, broken DR heading, broken version, broken redirect target, broken/valid anchor) confirmed each of the four checks actually fires on real defects, not just passes vacuously — not committed to the repository, run against a scratch copy during development."
  notes: "First Change Set in this cycle that can cite a real deterministic-validation command as evidence, instead of human review alone — the gap decisions/0034's Change Set explicitly named as still pending is now closed for this specific class of check."
