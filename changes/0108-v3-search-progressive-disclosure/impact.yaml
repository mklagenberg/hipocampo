change_set:
  id: "0108-v3-search-progressive-disclosure"
  class: "normative"
  semver: "minor"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0108-v3-search-progressive-disclosure.md"

impact:
  - artifact: "decisions/0108-v3-search-progressive-disclosure.md, changes/0108-v3-search-progressive-disclosure/proposal.md"
    status: "updated"
    note: "Records the accepted V3 candidate decision and the Change Set contract, alternatives, risks and recovery boundary."
  - artifact: "docs/v3-search-progressive-disclosure-contract.md, docs/v3-search-progressive-disclosure-fixtures.yaml"
    status: "updated"
    note: "Adds the authoritative candidate contract, disclosure scale, independent result envelope and sanitized deterministic fixtures."
  - artifact: "scripts/validate_v3_search_progressive_disclosure.py"
    status: "updated"
    note: "Validates the deterministic contract envelope without asserting semantic truth."
  - artifact: "docs/engines/catalog.md, docs/engines/dependency-map.md, docs/engines/test-matrix.yaml, docs/engines/deterministic-case-bindings.yaml"
    status: "updated"
    note: "Registers the logical engine, its dependency boundary and deterministic/semantic test assignments."
  - artifact: "scripts/validate_v3_engine_catalog.py"
    status: "updated"
    note: "Extends the canonical engine-set expectation; the existing suite executes the new matrix binding without a code change."
  - artifact: "docs/v3-constitutional-test-basis.yaml, docs/v3-semantic-fixtures.yaml"
    status: "updated"
    note: "Adds constitutional references and sanitized semantic fixtures for ranking, disclosure authorization and inaccessible evidence."
  - artifact: "scripts/validate_v3_semantic_review.py, scripts/validate_v3_semantic_constitutional_revalidation.py"
    status: "updated"
    note: "Keeps the historical two-pass package closed at 28 reviewed cases while excluding the three new review-pending candidate cases from that closed set."
  - artifact: "docs/taxonomy.md, docs/v3-contract.md, CHANGELOG.md, ROADMAP.md"
    status: "updated"
    note: "Synchronizes taxonomy, V3 candidate index, changelog and forward direction without changing the active v2.2.0 specification."
  - artifact: "SPEC.md, UPGRADE.md, MIGRATIONS.md, skill/, scaffold/, conformance/moda.yaml, moda.yaml"
    status: "reviewed"
    note: "Reviewed as release, migration, skill, scaffold and conformance projections; no active v2.2.0 or installed-instance contract changes are authorized in this candidate-only gate."
  - artifact: "knowledge_vaults/, private/"
    status: "not-applicable"
    note: "Real vault caches and private sensory capture are explicitly outside the sanitized local read-only test scope."

validation:
  commands:
    - "python -B scripts/validate_v3_search_progressive_disclosure.py --root ."
    - "python -B scripts/validate_v3_engine_catalog.py --root ."
    - "python -B scripts/validate_v3_engine_suite.py --root ."
    - "python -B scripts/validate_semantic_fixtures.py --root ."
    - "python -B scripts/validate_v3_constitutional_conformance.py --root ."
    - "python -B scripts/validate_change.py --root ."
    - "python -B scripts/validate_hipocampo.py --root ."
    - "python -B scripts/validate_contracts.py --root ."
  evidence:
    - "docs/v3-search-progressive-disclosure-contract.md"
    - "docs/v3-search-progressive-disclosure-fixtures.yaml"
    - "docs/engines/test-matrix.yaml"
    - "docs/v3-constitutional-test-basis.yaml"
  notes: "Candidate-only local validation; no real vault, MCP, remote repository or Record mutation is exercised."
