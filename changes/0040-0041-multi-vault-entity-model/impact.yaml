change_set:
  id: "0040-0041-multi-vault-entity-model"
  class: "normative"
  semver: "major"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0040-multi-vault-multi-entity-design-premises.md"
    - "decisions/0041-entity-model-and-vault-vocabulary.md"

impact:
  - artifact: "SPEC.md"
    status: "updated"
    note: "Section 2-C rewritten: 'Repository-type taxonomy: domain and tier' becomes 'Repository-type taxonomy: entity and vault' (decisions/0041). New section 2-D, 'Multi-vault and multi-entity design premises' (decisions/0040)."
  - artifact: "decisions/0040-multi-vault-multi-entity-design-premises.md, decisions/0041-entity-model-and-vault-vocabulary.md"
    status: "updated"
    note: "New Decision Records, both Status: Accepted."
  - artifact: "hipocampo.yaml (scaffold/skeleton/hipocampo.yaml)"
    status: "updated"
    note: "instance.domain removed; instance.entity, instance.role, instance.scope_description added. instance.tier (curation-level) and instance.language unchanged."
  - artifact: "scaffold/profiles/pessoal.yaml, scaffold/profiles/empresa.yaml"
    status: "updated"
    note: "New entity/role/scope_description inputs; hipocampo.yaml output note updated to describe the new fields instead of a fixed domain value."
  - artifact: "docs/vocabulary-dictionary.md"
    status: "updated"
    note: "New Change history entry for decisions/0041. domain table rows annotated as superseded (kept only for an unmigrated instance). 'Known, unresolved inconsistencies' entry about domain/Instance type replaced with an entry reflecting that Instance type is now recommended for retirement, not permanently unharmonized."
  - artifact: "MIGRATIONS.md"
    status: "updated"
    note: "First entry under a new '1.x -> 2.0' section: domain -> entity/role migration, step by step, framed as the first of several lotes this section will accumulate."
  - artifact: "UPGRADE.md"
    status: "updated"
    note: "hipocampo.yaml checklist item updated to reference entity/role instead of domain; new Mandatory/breaking item pointing at MIGRATIONS.md; Instance type item reworded from 'deliberately not harmonized' to 'recommended for retirement'; closing 'Backward-incompatible changes (MAJOR)' note updated from 'None so far' to point at the accumulating MIGRATIONS.md section."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "New [Unreleased] entries for decisions/0040, decisions/0041, this Change Set, and the SPEC.md/scaffold/vocabulary-dictionary/MIGRATIONS.md/UPGRADE.md updates."
  - artifact: "moda.yaml"
    status: "updated"
    note: "repository-taxonomy component source anchor updated for the renamed SPEC.md#2-c heading; new multi-vault-design-premises component; vault-manifest component source gains decisions/0041."
  - artifact: "conformance/moda.yaml"
    status: "updated"
    note: "packaging_and_synchronization evidence/notes gain decisions/0041 and flag that no real vault has migrated domain to entity/role yet. evolution evidence/notes gain decisions/0040-0041 as the first lote of the v2.0.0 taxonomy revision."
  - artifact: "skill/"
    status: "reviewed"
    note: "The personal skill copy (mklagenberg/hipocampo's own references/personalizacao.md and related files) is not part of this repository and is not touched here. The generic skill/ in this repository has no domain-specific routing logic to update for this Change Set -- discovery/bootstrap procedures that would consume entity/role at runtime are scoped to a later lote."
  - artifact: "existing real vaults (hipocampo-personal-vault, hipocampo-concepts, hipocampo-company, hipocampo-company-vault)"
    status: "not-applicable"
    note: "Real content repositories are never edited from this repository (SPEC.md section 1). Migrating each vault's hipocampo.yaml from domain to entity/role, and any eventual repository rename to the restricted/open convention, are separate operator actions tracked in MIGRATIONS.md/UPGRADE.md, not part of this Change Set's diff."

validation:
  commands:
    - "python3 scripts/validate_hipocampo.py --root ."
  evidence:
    - "Run on the branch before opening the PR: see PR description for the actual output."
  notes: "This Change Set adds two new Decision Records (template-checked by validate_hipocampo.py) and several cross-references to them from SPEC.md/CHANGELOG.md/UPGRADE.md/MIGRATIONS.md/docs/vocabulary-dictionary.md/moda.yaml (link resolution also checked). It does not touch document frontmatter (SPEC.md section 2) -- the schema-field coverage report is unaffected. Semantic completeness of the entity model and the discarded hub-spoke alternative remains human review, per docs/change-management.md's own stated limits."
