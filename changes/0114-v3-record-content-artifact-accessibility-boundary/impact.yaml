change_set:
  id: "0114-v3-record-content-artifact-accessibility-boundary"
  class: "normative"
  semver: "none"
  status: "implemented"
  backfill: false
  decisions:
    - "decisions/0109-v3-record-content-independent-of-artifact-accessibility.md"

impact:
  - artifact: "scripts/v3_crud_engine.py, scripts/validate_v3_crud.py, scripts/validate_v3_crud_use_cases.py"
    status: "updated"
    note: "Requires non-empty Record prose in the canonical CRUD shape and updates sanitized CRUD fixtures."
  - artifact: "scripts/v3_artifact_engine.py, scripts/validate_v3_artifacts.py, docs/v3-artifact-contract.md, docs/v3-artifact-fixtures.yaml"
    status: "updated"
    note: "Separates prose Record content from Artifact access and limits reconstruction to audit/revalidation."
  - artifact: "scripts/v3_search_engine.py, scripts/validate_v3_search_progressive_disclosure.py, docs/v3-search-progressive-disclosure-contract.md, docs/v3-search-progressive-disclosure-fixtures.yaml"
    status: "updated"
    note: "Preserves readable Record content when a linked Artifact is unavailable and blocks unavailable Record reads at L0."
  - artifact: "docs/v3-semantic-fixtures.yaml, docs/v3-search-progressive-disclosure-semantic-review.yaml, scripts/validate_v3_search_progressive_disclosure_review.py"
    status: "updated"
    note: "Adds a pending semantic case for prose-preserving Record access with an unavailable Artifact."
  - artifact: "docs/v3-constitutional-test-basis.yaml, docs/engines/test-matrix.yaml, docs/engines/deterministic-case-bindings.yaml"
    status: "updated"
    note: "Maps the clarified boundary to the constitutional basis and executable case inventory."
  - artifact: "docs/v3-contract.md, docs/taxonomy.md, docs/v3-vocabulary-and-aliases.md, docs/verification-boundaries.yaml"
    status: "updated"
    note: "Registers prose representation and the independent Artifact access boundary in candidate contract surfaces."
  - artifact: "CHANGELOG.md"
    status: "updated"
    note: "Records the unreleased V3 candidate boundary correction without activating a release."
  - artifact: "SPEC.md, UPGRADE.md, MIGRATIONS.md, skill/, scaffold/, conformance/moda.yaml, moda.yaml"
    status: "reviewed"
    note: "No released specification, migration, skill, scaffold or MODA-claim change is authorized."
  - artifact: "knowledge_vaults/, private/"
    status: "not-applicable"
    note: "Only sanitized in-memory fixtures are used; no real vault or private capture is read or written."

validation:
  commands:
    - "python -B scripts/validate_v3_artifacts.py --root ."
    - "python -B scripts/validate_v3_crud.py --root ."
    - "python -B scripts/validate_v3_crud_use_cases.py --root ."
    - "python -B scripts/validate_v3_search_progressive_disclosure.py --root ."
    - "python -B scripts/validate_v3_search_progressive_disclosure_review.py --root ."
    - "python -B scripts/validate_v3_engine_catalog.py --root ."
    - "python -B scripts/validate_v3_engine_suite.py --root ."
    - "python -B scripts/validate_semantic_fixtures.py --root ."
    - "python -B scripts/validate_v3_semantic_review.py --root ."
    - "python -B scripts/validate_v3_semantic_constitutional_revalidation.py --root ."
    - "python -B scripts/validate_v3_constitutional_conformance.py --root ."
    - "python -B scripts/validate_change.py --root ."
    - "python -B scripts/validate_hipocampo.py --root ."
    - "python -B scripts/validate_contracts.py --root ."
  evidence:
    - "scripts/v3_crud_engine.py"
    - "scripts/v3_artifact_engine.py"
    - "scripts/v3_search_engine.py"
    - "scripts/validate_v3_search_progressive_disclosure.py"
    - "docs/v3-artifact-fixtures.yaml"
    - "docs/v3-search-progressive-disclosure-fixtures.yaml"
    - "docs/v3-search-progressive-disclosure-semantic-review.yaml"
  notes: "Local unreleased V3 candidate execution only; no deploy, release, remote write, vault read or MCP integration."
