  semver: "minor"
  status: "proposed"
  backfill: false
  decisions:
    - "decisions/0058-canonical-compatibility-contract.md"

impact:
  - artifact: "docs/verification-boundaries.md, scripts/validate_boundaries.py"
    status: "updated"
    note: "Adds the canonical registry and deterministic check for verification boundaries."
  - artifact: "SPEC.md, conformance/moda.yaml"
    status: "updated"
    note: "References the boundary registry and keeps conformance claims proportional to evidence."
  - artifact: "README.md, CHANGELOG.md, UPGRADE.md, MIGRATIONS.md, skill/, scaffold/"
