moda:
  manifest_version: "1.0"
  repository: "https://github.com/mklagenberg/hipocampo"
  compatibility: "^1.0.0"
  verified_against: "1.0.0"
  verified_commit: "81171ed22163f73f250e32534f9edc3a4f8d51e1"

artifact:
  id: "hipocampo"
  name: "Hipocampo"
  full_name: "Hipocampo — agentic second brain methodology"
  kind: "methodology"
  domain: "personal-and-corporate-knowledge-management"
  version: "1.9.0"
  status: "active"
  language: "en"
  repository: "https://github.com/mklagenberg/hipocampo"
  license: "Apache-2.0"

adoption:
  relationship: "audited_against"
  mode: "retrospective"
  claim_stage: "mapped"
  conformance_result: "partial"

documentation:
  human_entrypoint: "README.md"
  agent_entrypoint: "AGENTS.md"
  specification: "SPEC.md"
  getting_started: "GETTING-STARTED.md"
  invariants: "SPEC.md#8-extensioncustomization-and-agent-precedence"
  best_practices: "BEST-PRACTICES.md"
  limitations: "DISCLAIMER.md"
  changelog: "CHANGELOG.md"
  roadmap: "ROADMAP.md"
  upgrade: "UPGRADE.md"
  migrations: "MIGRATIONS.md"
  decisions: "decisions/"
  decision_policy: "SPEC.md#7-decision-record-vs-type-decision"
  change_management: "docs/change-management.md"
  validation: "audits/moda/2026-08-17-v1.0.0-self-audit.md"
  structural_validation: "scripts/validate_hipocampo.py"
  release_checklist: "RELEASE-CHECKLIST.md"
  evaluation_scenarios: "docs/evaluation-scenarios.md"
  taxonomy_map: "docs/taxonomy.md"
  step_classification: "docs/step-classification.md"
  git_workflow: "decisions/0014-mandatory-release-routine.md"

components:
  - id: "frontmatter-schema"
    kind: "specification"
    source: "SPEC.md#2-frontmatter-unified-schema"
    lifecycle: "embedded"
  - id: "repository-taxonomy"
    kind: "model"
    source: "SPEC.md#2-c-repository-type-taxonomy-entity-and-vault"
    lifecycle: "embedded"
  - id: "multi-vault-design-premises"
    kind: "model"
    source: "SPEC.md#2-d-multi-vault-and-multi-entity-design-premises, decisions/0040-multi-vault-multi-entity-design-premises.md"
    lifecycle: "embedded"
  - id: "rem-ritual"
    kind: "procedure"
    source: "SPEC.md#5-a-rem-ritual-and-memory-layers"
    lifecycle: "embedded"
  - id: "frontmatter-audit"
    kind: "procedure"
    source: "SPEC.md#5-b-frontmatter-audit"
    lifecycle: "embedded"
  - id: "structural-audit"
    kind: "procedure"
    source: "SPEC.md#5-c-weekly-structural-audit"
    lifecycle: "embedded"
  - id: "dispatcher"
    kind: "procedure"
    source: "SPEC.md#5-d-dispatcher-and-the-four-layer-taxonomy-routine-mechanic-action, decisions/0042-dispatcher-decoupled-from-rem.md"
    lifecycle: "embedded"
  - id: "mechanics-taxonomy"
    kind: "model"
    source: "SPEC.md#5-d-dispatcher-and-the-four-layer-taxonomy-routine-mechanic-action, decisions/0043-dispatcher-routine-mechanic-action-taxonomy.md, decisions/0045-bootstrap-mechanic-and-profile-md.md"
    lifecycle: "embedded"
  - id: "vault-discovery"
    kind: "procedure"
    source: "SPEC.md#12-a-vault-and-entity-discovery, decisions/0044-vault-and-entity-discovery.md"
    lifecycle: "embedded"
  - id: "bootstrap-mechanic"
    kind: "procedure"
    source: "SPEC.md#12-b-bootstrap-mechanic-instantiation-and-profilemd, decisions/0045-bootstrap-mechanic-and-profile-md.md"
    lifecycle: "embedded"
  - id: "onboarding-tutorial"
    kind: "reference"
    source: "docs/getting-started-non-technical.md"
    lifecycle: "embedded"
  - id: "invite-template"
    kind: "template"
    source: "docs/invite-template.md"
    lifecycle: "embedded"
  - id: "cross-repo-lifecycle-actions"
    kind: "pattern"
    source: "SPEC.md#13-cross-repository-lifecycle-actions-promote-depromote-redbutton"
    lifecycle: "embedded"
  - id: "decision-record-template"
    kind: "template"
    source: "SPEC.md#7-decision-record-vs-type-decision"
    lifecycle: "embedded"
  - id: "change-set-mechanism"
    kind: "protocol"
    source: "docs/change-management.md"
    lifecycle: "embedded"
  - id: "structural-validation"
    kind: "tool"
    source: "scripts/validate_hipocampo.py, .github/workflows/validate.yml"
    lifecycle: "embedded"
  - id: "failure-and-recovery-behavior"
    kind: "specification"
    source: "SPEC.md#14-behavior-under-failure-and-recovery"
    lifecycle: "embedded"
  - id: "skill-repository-precedence"
    kind: "specification"
    source: "SPEC.md#8-extensioncustomization-and-agent-precedence, decisions/0046-repository-content-overrides-skill-local-state.md"
    lifecycle: "embedded"
  - id: "evaluation-scenarios"
    kind: "reference"
    source: "docs/evaluation-scenarios.md"
    lifecycle: "embedded"
  - id: "taxonomy-map"
    kind: "reference"
    source: "docs/taxonomy.md, decisions/0047-taxonomy-map.md"
    lifecycle: "embedded"
  - id: "step-classification"
    kind: "model"
    source: "docs/step-classification.md, decisions/0048-step-classification-scheme.md"
    lifecycle: "embedded"
  - id: "personal-skill"
    kind: "skill"
    source: "skill/SKILL.md"
    lifecycle: "embedded"
  - id: "vault-scaffold"
    kind: "scaffold"
    source: "scaffold/ (scaffold/profiles/pessoal.yaml, scaffold/profiles/empresa.yaml)"
    lifecycle: "embedded"
  - id: "vault-manifest"
    kind: "schema"
    source: "decisions/0033-hipocampo-yaml-per-vault-manifest.md, decisions/0034-repository-and-vault-language-policy.md, decisions/0041-entity-model-and-vault-vocabulary.md (scaffold/skeleton/hipocampo.yaml)"
    lifecycle: "embedded"

packages:
  specification:
    role: "normative-specification"
    version: "1.9.0"
    source: "SPEC.md"
    source_kind: "local"
  decisions:
    role: "durable-decision-records"
    version: "1.9.0"
    source: "decisions/"
    source_kind: "local"
  skill:
    role: "client-side-operational-skill"
    version: "see skill/manifest.yaml"
    source: "skill/"
    source_kind: "local"
  scaffold:
    role: "vault-instantiation-scaffold"
    version: "1.0.0"
    source: "scaffold/"
    source_kind: "local"

installations: []

conformance:
  profile: "conformance/moda.yaml"
  latest_audit: "audits/moda/2026-08-17-v1.0.0-self-audit.md"
  audit_mode: "self-audit"

synchronization:
  policy: "UPGRADE.md"
  state: "current"
  reason: "SPEC.md, CHANGELOG.md, and decisions/ are kept manually synchronized on every merged PR (a Decision Record accompanied by the corresponding entries in SPEC.md/CHANGELOG.md for every structural change); starting from Phase C, operational/normative changes are also accompanied by a Change Set in changes/. Starting from Phase D, skill/ and scaffold/ live inside the repository itself (no cross-repository synchronization with hipocampo-toolkit, which was consolidated and archived). No automated drift check exists yet — see conformance/moda.yaml, controls packaging_and_synchronization and quality_and_evaluation."
