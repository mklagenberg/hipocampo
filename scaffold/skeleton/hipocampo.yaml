# Vault manifest — generated by the agent at instantiation time.
# Vocabulary note: 'domain'/'tier' below use the current English vocabulary
# (hipocampo/decisions/0035, hipocampo/docs/vocabulary-dictionary.md). This same
# repository's AGENTS.md 'Instance type' field uses a separate vocabulary
# (corporate | personal, or the deprecated pt-BR corporativa | pessoal) that is
# NOT the same axis as 'domain' — that divergence is known and documented in
# hipocampo/decisions/0033, not harmonized by this change either.
# Tier note: 'instance.tier' below (content | vault, repository curation level,
# hipocampo/decisions/0033) is a DIFFERENT concept from the confidential/public
# exposure tier in hipocampo/SPEC.md section 2-C / hipocampo/decisions/0029 — a
# pre-existing mismatch, flagged in hipocampo/decisions/0035, not resolved here.
# Language note: 'instance.language' below is this vault's own content language —
# independent of hipocampo's own language (English, hipocampo/decisions/0034).
# Defaults to "en" (the scaffold's own language); confirm with the operator before
# finalizing, especially for a vault that will actually be written in another
# language (e.g. "pt-BR").

hipocampo:
  manifest_version: "1.0"
  compatibility: "^1.9.0"
  verified_against: "<fill in: version of hipocampo/SPEC.md at instantiation time>"
  verified_commit: "<fill in: commit of hipocampo/main used as the scaffold source>"

instance:
  repository: "<fill in: URL of this repository>"
  domain: "<fill in: personal | company>"
  tier: "<fill in: content | vault>"
  language: "en"

scaffold:
  profile: "<fill in: pessoal | empresa>"    # scaffold profile id — literal filename token, not translated (PR #27)
  profile_version: "1.0.0"
  engine_version: "1.0.0"
  source_repository: "https://github.com/mklagenberg/hipocampo"
  source_commit: "<fill in: same commit as hipocampo.verified_commit>"

skill:
  generated_by_version: "<fill in: version of the personal skill that ran the instantiation>"

state: "current"