# Manifesto do vault — gerado pelo agente no momento da instanciação.
# Nota de vocabulário: 'domain' aqui usa o vocabulário mais recente (pessoal | empresa,
# hipocampo/decisions/0029), enquanto o AGENTS.md deste mesmo repositório usa o
# vocabulário original ('Tipo de instância': corporativa | pessoal). A divergência é
# conhecida e documentada em hipocampo/decisions/0033 — não harmonizada ainda.

hipocampo:
  manifest_version: "1.0"
  compatibility: "^1.9.0"
  verified_against: "<preencher: versão do hipocampo/SPEC.md no momento da instanciação>"
  verified_commit: "<preencher: commit de hipocampo/main usado como fonte do scaffold>"

instance:
  repository: "<preencher: URL deste repositório>"
  domain: "<preencher: pessoal | empresa>"
  tier: "<preencher: conteudo | vault>"

scaffold:
  profile: "<preencher: pessoal | empresa>"
  profile_version: "1.0.0"
  engine_version: "1.0.0"
  source_repository: "https://github.com/mklagenberg/hipocampo"
  source_commit: "<preencher: mesmo commit de hipocampo.verified_commit>"

skill:
  generated_by_version: "<preencher: versão da skill pessoal que executou a instanciação>"

state: "current"
