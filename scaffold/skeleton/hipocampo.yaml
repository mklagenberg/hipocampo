# Vault manifest — generated by the agent at instantiation time.
# Entity note: 'instance.entity'/'instance.role'/'instance.scope_description'
# below replace the former 'instance.domain' field (hipocampo/decisions/0041,
# hipocampo/SPEC.md section 2-C). This same repository's AGENTS.md 'Instance
# type' field (corporate | personal, or the deprecated pt-BR corporativa |
# pessoal) is recommended for retirement now that entity+role derive the same
# information — not yet removed from any real instance (see decisions/0041).
# Curation note: 'instance.curation_level' below (content | vault, repository curation level,
# hipocampo/decisions/0033) is a DIFFERENT concept from the confidential/public
# exposure tier in hipocampo/SPEC.md section 2-C / hipocampo/decisions/0029 — a
# pre-existing mismatch, flagged in hipocampo/decisions/0035, not resolved by
# the entity model either.
# Language note: 'instance.language' below is this vault's own content language —
# independent of hipocampo's own language (English, hipocampo/decisions/0034).
# Defaults to "en" (the scaffold's own language); confirm with the operator before
# finalizing, especially for a vault that will actually be written in another
# language (e.g. "pt-BR").

hipocampo:
  manifest_version: "1.0"
  compatibility: "^2.1.1"
  verified_against: "<fill in: version of hipocampo/SPEC.md at instantiation time>"
  verified_commit: "<fill in: commit of hipocampo/main used as the scaffold source>"

instance:
  repository: "<fill in: URL of this repository>"
  entity: "<fill in: entity identifier, e.g. personal, or a specific company/family name>"
  role: "<fill in: anchor | additional>"
  scope_description: "<fill in only when role: additional — what belongs in this vault; omit entirely when role: anchor>"
  policy_profile: "<fill in: personal | corporate — selects the sensitive-data policy>"
  curation_level: "<fill in: content | vault>"
  language: "en"

# Present only in an anchor vault. This is an operator-confirmed address list,
# not a router: each listed repository remains authoritative for its own
# entity, role, and scope declaration.
discovery:
  registered_repositories: []

scaffold:
  profile: "<fill in: pessoal | empresa>"    # scaffold profile id — literal filename token, not translated (PR #27)
  profile_version: "1.0.0"
  engine_version: "1.0.0"
  source_repository: "https://github.com/mklagenberg/hipocampo"
  source_commit: "<fill in: same commit as hipocampo.verified_commit>"

skill:
  generated_by_version: "<fill in: version of the personal skill that ran the instantiation>"

state: "current"
