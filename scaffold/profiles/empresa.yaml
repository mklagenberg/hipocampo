profile:
  id: "empresa"
  version: "1.0.0"
  purpose: "Generates a Hipocampo content repository whose owner is a company (e.g., hipocampo-company, hipocampo-company-vault)."

methodology:
  compatibility: "^1.9.0"

engine:
  version: "1.0.0"
  source_repository: "https://github.com/mklagenberg/hipocampo"
  source_commit: "<filled in by the agent at instantiation time, HEAD of main>"

inputs:
  - id: "repository_name"
    required: true
    description: "Name of the new repository to be created (e.g., hipocampo-company-vault)."
  - id: "tier"
    required: true
    enum: ["content", "vault"]
    description: "Repository curation level: 'content' (receives public/internal/confidential/restricted visibility) or 'vault' (confidential/restricted only — LICENSE keeps only sections c/d). Deprecated pt-BR value for 'content' is 'conteudo' — see hipocampo/docs/vocabulary-dictionary.md."
  - id: "company_legal_name"
    required: true
    description: "Legal (registered) name of the company that owns the content."
  - id: "instance_scope"
    required: true
    description: "What belongs in this repository and what doesn't (fills in AGENTS.md, section 'Scope of this repository')."
  - id: "language"
    required: false
    default: "en"
    description: "BCP-47 tag for the language this vault's content will actually be written in (e.g., 'en', 'pt-BR'). Defaults to English, matching the scaffold's own language — confirm with the user before finalizing rather than assuming the default (hipocampo/decisions/0034)."
  - id: "entity"
    required: true
    default: "<same as company_legal_name, unless the operator wants a shorter/distinct entity identifier>"
    description: "Entity identifier this vault belongs to (hipocampo/decisions/0041, hipocampo/SPEC.md section 2-C). Defaults to company_legal_name — an operator who already has an entity identifier in use for this company (e.g., a shorter internal name) may override it."
  - id: "role"
    required: true
    enum: ["anchor", "additional"]
    description: "Whether this is the entity's one mandatory private anchor vault, or an additional vault (hipocampo/decisions/0040, premise 3). The agent confirms with the operator whether an anchor already exists for this entity before generating a second one."
  - id: "scope_description"
    required: false
    description: "Required only when role: additional — short statement of what belongs in this vault, as distinct from the entity's other vaults. Omit entirely when role: anchor."

outputs:
  - path: "AGENTS.md"
    operation: "generate"
    ownership: "generated-once"
    note: "Filled in from the collected inputs; the user may edit it freely afterward."
  - path: "CLAUDE.md"
    operation: "generate"
    ownership: "canonical-reference"
    note: "Thin pointer to AGENTS.md; shouldn't need editing."
  - path: "POST-INSTANTIATION.md"
    operation: "generate"
    ownership: "canonical-reference"
    note: "Post-generation verification checklist; fixed content across every instance."
  - path: "LICENSE"
    operation: "generate"
    ownership: "generated-once"
    note: "Generated from scaffold/license-templates/LICENSE-corporativo.md, adjusted by tier (see license-templates/README.md)."
  - path: "registry.md"
    operation: "generate"
    ownership: "managed-structure"
    note: "Empty table at generation time; grows only by addition (never edit an existing row)."
  - path: "example/exemplo-nota.md"
    operation: "generate"
    ownership: "user-authored"
    note: "Illustrative; the user deletes or replaces it before the first real document."
  - path: "hipocampo.yaml"
    operation: "generate"
    ownership: "managed-structure"
    note: "Vault manifest (hipocampo/decisions/0033, hipocampo/decisions/0034, hipocampo/decisions/0035, hipocampo/decisions/0041); entity/role/scope_description filled from the collected inputs, language defaults to 'en' unless overridden by the collected input."

conflicts:
  default: "stop-and-report"
  allow_silent_overwrite: false

upgrade:
  automatic: false
  managed_ownership_only: true
  migration_guide: "hipocampo/UPGRADE.md"

postconditions:
  validator: "human review via generated POST-INSTANTIATION.md"
  conformance_claim: "declared"
