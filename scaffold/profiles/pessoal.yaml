profile:
  id: "pessoal"
  version: "1.0.0"
  purpose: "Generates a Hipocampo content repository whose owner is a natural person (e.g., hipocampo-concepts, hipocampo-personal-vault)."

methodology:
  compatibility: "^1.9.0"

engine:
  version: "1.0.0"
  source_repository: "https://github.com/mklagenberg/hipocampo"
  source_commit: "<filled in by the agent at instantiation time, HEAD of main>"

inputs:
  - id: "repository_name"
    required: true
    description: "Name of the new repository to be created (e.g., hipocampo-personal-vault)."
  - id: "tier"
    required: true
    enum: ["conteudo", "vault"]
    description: "Repository curation level: 'conteudo' (receives public/internal/confidential/restricted visibility) or 'vault' (confidential/restricted only — LICENSE keeps only sections c/d)."
  - id: "owner_full_name"
    required: true
    description: "Full name of the content owner, a natural person."
  - id: "owner_github_handle"
    required: true
    description: "GitHub handle of the owner, without @."
  - id: "instance_scope"
    required: true
    description: "What belongs in this repository and what doesn't (fills in AGENTS.md, section 'Scope of this repository')."

outputs:
  - path: "AGENTS.md"
    operation: "generate"
    ownership: "generated-once"
    note: "Filled in from the collected inputs; the user may edit it freely afterward."
  - path: "CLAUDE.md"
    operation: "generate"
    ownership: "canonical-reference"
    note: "Thin pointer to AGENTS.md; shouldn't need editing."
  - path: "POST-INSTANTIATION.md"
    operation: "generate"
    ownership: "canonical-reference"
    note: "Post-generation verification checklist; fixed content across every instance."
  - path: "LICENSE"
    operation: "generate"
    ownership: "generated-once"
    note: "Generated from scaffold/license-templates/LICENSE-pessoal.md, adjusted by tier (see license-templates/README.md)."
  - path: "registry.md"
    operation: "generate"
    ownership: "managed-structure"
    note: "Empty table at generation time; grows only by addition (never edit an existing row)."
  - path: "example/exemplo-nota.md"
    operation: "generate"
    ownership: "user-authored"
    note: "Illustrative; the user deletes or replaces it before the first real document."
  - path: "hipocampo.yaml"
    operation: "generate"
    ownership: "managed-structure"
    note: "Vault manifest (hipocampo/decisions/0033); domain fixed to 'pessoal' for this profile."

conflicts:
  default: "stop-and-report"
  allow_silent_overwrite: false

upgrade:
  automatic: false
  managed_ownership_only: true
  migration_guide: "hipocampo/UPGRADE.md"

postconditions:
  validator: "human review via generated POST-INSTANTIATION.md"
  conformance_claim: "declared"