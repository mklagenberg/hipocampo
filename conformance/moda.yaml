subject:
  id: "hipocampo"
  kind: "methodology"
  version: "1.9.0"
  adoption_mode: "retrospective"

assessment:
  claim_stage: "mapped"
  result: "partial"

controls:
  problem_and_purpose:
    status: "satisfied"
    evidence: ["README.md", "DISCLAIMER.md"]
  activation_and_proportionality:
    status: "partial"
    evidence: ["DISCLAIMER.md", "SPEC.md#2-a-sensitive-data-policy-by-instance-type"]
    notes: ["Recommended/not-recommended scenarios exist; an explicit rule for how rigor/autonomy/evidence/cost scale with risk is missing."]
  human_reference_practice:
    status: "satisfied"
    evidence: ["BEST-PRACTICES.md", "GETTING-STARTED.md"]
  inputs_outputs_and_invariants:
    status: "satisfied"
    evidence: ["SPEC.md#2-frontmatter-unified-schema", "SPEC.md#8-extensioncustomization-and-agent-precedence", "DISCLAIMER.md", "decisions/0046-repository-content-overrides-skill-local-state.md"]
    notes: ["The invariants list grows from five to six this round: repository content always overrides locally-cached or customized skill state (decisions/0046) — a trust boundary distinct in kind from the other five (skill-versus-repository authority, not a content/access/deletion rule), closing a blind spot none of the existing rituals could see because none of them operate on the local skill copy at all."]
  decomposition_and_control_flow:
    status: "partial"
    evidence: ["SPEC.md#5-a-rem-ritual-and-memory-layers", "SPEC.md#5-b-frontmatter-audit", "SPEC.md#5-c-weekly-structural-audit", "SPEC.md#5-d-dispatcher-and-the-four-layer-taxonomy-routine-mechanic-action", "SPEC.md#12-a-vault-and-entity-discovery", "SPEC.md#12-b-bootstrap-mechanic-instantiation-and-profilemd", "decisions/0042-dispatcher-decoupled-from-rem.md", "decisions/0043-dispatcher-routine-mechanic-action-taxonomy.md", "decisions/0044-vault-and-entity-discovery.md", "decisions/0045-bootstrap-mechanic-and-profile-md.md", "docs/taxonomy.md", "decisions/0047-taxonomy-map.md"]
    notes: ["Rituals are well described. A four-layer taxonomy (Dispatcher/Routine/Mechanic/Action) now names what kind of thing each piece of behavior is, closing part of this gap. Bootstrap (decisions/0045) is now a fourth named mechanic, with its own recognized trigger condition and a four-action sequence (Select/Orient/Instantiate/Interview) — the first mechanic whose trigger is explicitly specified, not just its membership in the taxonomy. A single taxonomy map (decisions/0047) now indexes every controlled field and named concept with a pointer to its authoritative source, including retroactive version lineage back to v1.0.0 (Lote E2 completed the backfill Lote E1 deferred). This round's onboarding revalidation (decisions/0049) deliberately does not add its new Create Invite action to this taxonomy — no durable write of its own, no gate needed, so formalizing it would be the same premature-structure mistake decisions/0025 and decisions/0029 already argue against elsewhere. Still partial: execution order among Dispatcher's routines remains fixed rather than an explicit MODA-style stage/gate/parallelism/stop-condition model — deliberately deferred until a real instance actually runs these rituals (decisions/0042)."]
  distribution_of_agency:
    status: "partial"
    evidence: ["SPEC.md#8-extensioncustomization-and-agent-precedence", "skill/references/instantiation.md", "SPEC.md#12-a-vault-and-entity-discovery", "SPEC.md#12-b-bootstrap-mechanic-instantiation-and-profilemd", "decisions/0044-vault-and-entity-discovery.md", "decisions/0045-bootstrap-mechanic-and-profile-md.md", "docs/step-classification.md", "decisions/0048-step-classification-scheme.md"]
    notes: ["Invariant 5 and the recurring write gates exist in practice — including in the agent-driven instantiation procedure (Phase D) and, this round, the Bootstrap mechanic's Interview action and vault discovery's read/cache step, each explicitly classified as gated vs. ungated (decisions/0044, decisions/0045). A single place now classifies every currently-named routine, mechanic action, and failure-recovery mode against Hipocampo's own three-value scheme (deterministic/discretionary/gated, decisions/0048) — narrows, but does not close, this control's gap: that scheme is not mapped onto MODA's own five-value agency vocabulary (deterministic/agent-reasoned/tool-executed/human-decided/hybrid) named by this control, a translation deliberately not attempted (decisions/0048, Discarded alternatives). Also unresolved: the classification is manually maintained, with no mechanism keeping it in sync as new mechanics/actions are added (docs/step-classification.md, 'Known limitation')."]
  orchestration:
    status: "not-applicable"
    evidence: ["decisions/0025-skill-is-client-side-never-per-repository.md"]
    notes: ["Hipocampo is designed for one agent at a time, client-side — no multi-agent orchestration."]
  contracts:
    status: "partial"
    evidence: ["SPEC.md#5-b-frontmatter-audit", "scaffold/profiles/pessoal.yaml", "scaffold/profiles/empresa.yaml"]
    notes: ["Ritual outputs exist (e.g., meta/fila-de-manutencao.md) but are not formalized as a contract (completion criterion, error state, control handback). The scaffold profiles (Phase D) already formally declare inputs/outputs/conflicts, but only for instantiation — not for the recurring rituals."]
  state_context_and_knowledge:
    status: "satisfied"
    evidence: ["SPEC.md#5-a-rem-ritual-and-memory-layers", "SPEC.md#6-related-across-repositories-the-registry"]
  quality_and_evaluation:
    status: "partial"
    evidence: ["docs/evaluation-scenarios.md", "decisions/0039-minimal-evaluation-scenarios.md"]
    notes: ["A minimal, human-run reference of four representative scenarios now exists (Fase H, closes major finding 7's 'no representative test scenario' gap). Still partial by design, not oversight: no baseline or automated acceptance threshold was introduced — decisions/0039 explicitly rules that out as disproportionate to a one-person-maintained methodology, and this repository never stores the live content a real harness would need (SPEC.md section 1)."]
  safety_security_and_privacy:
    status: "satisfied"
    evidence: ["SPEC.md#2-a-sensitive-data-policy-by-instance-type", "SPEC.md#8-extensioncustomization-and-agent-precedence"]
  failure_and_recovery:
    status: "satisfied"
    evidence: ["SPEC.md#14-behavior-under-failure-and-recovery", "decisions/0038-failure-and-recovery-behavior.md"]
    notes: ["Defined behavior under all six modes the audit named — insufficient evidence, frontmatter/body contradiction, unavailable tool, interruption mid-ritual, unsafe request, incompatible migration (Fase H, closes major finding 6)."]
  portability:
    status: "satisfied"
    evidence: ["decisions/0025-skill-is-client-side-never-per-repository.md", "docs/MULTI-TOOL-USAGE.md", "docs/AI-MODELS.md"]
  packaging_and_synchronization:
    status: "partial"
    evidence: ["UPGRADE.md", "moda.yaml", "skill/manifest.yaml", "scaffold/skeleton/hipocampo.yaml", "decisions/0033-hipocampo-yaml-per-vault-manifest.md", "decisions/0034-repository-and-vault-language-policy.md", "decisions/0041-entity-model-and-vault-vocabulary.md", "decisions/0044-vault-and-entity-discovery.md", "skill/references/personalization.md", "SPEC.md#8-extensioncustomization-and-agent-precedence", "decisions/0046-repository-content-overrides-skill-local-state.md"]
    notes: ["UPGRADE.md is strong; skill/manifest.yaml (the skill's machine manifest) and the per-vault hipocampo.yaml template now exist (Phase D), extended with instance.language (decisions/0034) and instance.entity/instance.role/instance.scope_description replacing instance.domain (decisions/0041). None of the 4 existing real vaults has been retroactively updated with hipocampo.yaml yet, and none has migrated domain to entity/role yet — see UPGRADE.md and MIGRATIONS.md. Lote C retired the personal skill copy's hand-filled repository router and multi-account identity table in favor of runtime discovery from each vault's own manifest (decisions/0044) — removing one local-drift surface the skill previously depended on staying manually in sync. This round (decisions/0046) generalizes that fix into Invariant 6: repository content always overrides locally-cached or customized skill state, for any structured repository file, not only the router that was just retired — a durable resolution rule for drift, not only a one-time removal of a specific surface. Still partial: the invariant states a resolution rule, it doesn't mechanically detect drift (e.g. an automated check comparing the skill's cached state against the repository at session start) — that remains agent-executed judgment, not tooling; and the one pointer that still can't be discovered (the personal anchor vault's own address) remains an explicitly open, undesigned item."]
  evolution:
    status: "partial"
    evidence: ["CHANGELOG.md", "decisions/", "UPGRADE.md", "MIGRATIONS.md", "ROADMAP.md", "SPEC.md#9-versioning", "decisions/0040-multi-vault-multi-entity-design-premises.md", "decisions/0041-entity-model-and-vault-vocabulary.md", "decisions/0042-dispatcher-decoupled-from-rem.md", "decisions/0043-dispatcher-routine-mechanic-action-taxonomy.md", "decisions/0044-vault-and-entity-discovery.md", "decisions/0045-bootstrap-mechanic-and-profile-md.md", "decisions/0046-repository-content-overrides-skill-local-state.md", "decisions/0047-taxonomy-map.md", "decisions/0048-step-classification-scheme.md", "decisions/0049-onboarding-templates-and-create-invite-action.md"]
    notes: ["ROADMAP.md and the repository type taxonomy (decisions/0029-0030) are already complete; a declared cadence for auditing the methodology itself is still missing. The entity model (decisions/0040-0041) is the first lote of the v2.0.0 taxonomy revision; the Dispatcher/Routine/Mechanic/Action taxonomy (decisions/0042-0043) is the second; vault/entity discovery and the Bootstrap mechanic (decisions/0044-0045) are the third; the skill-versus-repository invariant (decisions/0046) is the fourth; the taxonomy map and step-classification reference (decisions/0047-0048) are the fifth, itself split into two sub-lotes — E1 and E2 — both now complete; the onboarding-templates revalidation and Create Invite action (decisions/0049) is the sixth, scoped to Claude/ChatGPT only, Codex/Copilot deliberately deferred, amended pre-merge with a corrected repository-creation-capability claim (Cowork/Claude Code only, not the standard Claude.ai/Desktop or ChatGPT connectors) found by checking Mauricio's personal knowledge base, plus a new homologation-status concept distinguishing platform-agnostic capability from onboarding-walkthrough validation."]
  specification_driven_change_control:
    status: "partial"
    evidence: ["docs/change-management.md", "decisions/0031-change-set-mechanism.md", "changes/0026-0028-fact-account-opinion-memory-taxonomy-and-cross-repo-lifecycle/", "changes/0032-0033-scaffolding-and-vault-manifest/", "changes/0034-repository-and-vault-language-policy/", "changes/0038-0039-failure-recovery-and-evaluation-scenarios/"]
    notes: ["The Change Set mechanism exists and is documented, with a backfill exercise (PR #22) and several prospective Change Sets (0032/0033, 0038/0039) validating the template in both modes. This evidence list is illustrative, not an exhaustive index of every Change Set folder — changes/0035-.../ and changes/0036-0037-.../ also exist but aren't cited here; a pre-existing gap, flagged in PR #30, left to Mau's discretion rather than fixed opportunistically. Still no deterministic validation comparing impact.yaml against the actual diff (see quality_and_evaluation)."]
  repository_contract:
    status: "partial"
    evidence: ["README.md", "AGENTS.md", "moda.yaml", "CHANGELOG.md", "ROADMAP.md", "decisions/", "UPGRADE.md", "MIGRATIONS.md", "docs/change-management.md", "changes/", "scaffold/", "scripts/validate_hipocampo.py", ".github/workflows/validate.yml", "RELEASE-CHECKLIST.md"]
    notes: ["Change-management policy satisfied (docs/change-management.md); scaffold mechanism is now declarative (scaffold/, Phase D); deterministic validation of the repository's own structure now exists and runs in CI (scripts/validate_hipocampo.py, .github/workflows/validate.yml, decisions/0036 — Fase G, closes MODA self-audit major finding 4); a minimal release-gate checklist now exists (RELEASE-CHECKLIST.md, decisions/0037, closes minor finding 2). Still partial by design, not oversight: no branch-protection rule enforcing the CI check is declared (a GitHub repository setting no available tool configures — manual follow-up for Mau, same category as archiving hipocampo-toolkit), and MODA's full ten-gate release model was deliberately not adopted (decisions/0037, proportionality). The impact.yaml-vs-actual-diff check remains unautomated (see specification_driven_change_control) — a separate, harder problem than what Fase G scoped."]

exceptions: []
