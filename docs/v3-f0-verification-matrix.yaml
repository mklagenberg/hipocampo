version: "v3-f0-candidate-1"
phases:
  - id: execution
    required_checks: [contract, privacy_scope, target_access, staleness, event]
    blocking_results: [contract_incompatible, privacy_unknown, target_unavailable, stale_blocked]
    evidence: [rule_revision, result, coverage, limits]
  - id: review
    required_checks: [evidence_completeness, authority_scope, semantic_boundary, correlation]
    blocking_results: [missing_evidence, authority_unresolved, semantic_decision_required]
    evidence: [reviewer, evidence_refs, semantic_limit]
  - id: publication
    required_checks: [privacy_destination, compatibility, provenance, human_approval]
    blocking_results: [privacy_unproven, compatibility_missing, approval_missing]
    evidence: [destination, version, approval_ref, package_fingerprint]
  - id: migration
    required_checks: [mapping, privacy_recheck, rollback, target_contract, human_approval]
    blocking_results: [mapping_missing, privacy_unproven, rollback_missing, approval_missing]
    evidence: [source_version, target_version, mapping_ref, rollback_ref]
  - id: retraction
    required_checks: [reach_matrix, invalidation, future_use_block, event]
    blocking_results: [reach_unknown, invalidation_unproven, future_use_unblocked]
    evidence: [surface_reach, invalidation_result, blocked_surfaces]
