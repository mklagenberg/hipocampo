    rationale: A hypothetical stale or conflicting Record cannot become current guidance
      through rank, recency, hashing or disclosure approval. Inaccessible Record content
      blocks the dependent read. Readable persisted prose remains readable when its
      referenced Artifact is unavailable, with freshness and verification limits preserved;
