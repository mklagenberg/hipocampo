    - docs/v3-search-progressive-disclosure-contract.md
    uncertainty: No real source material was retrieved.
  - case_id: SKILL-S-005
    disposition: preserve_v3_0_baseline_or_rework
    rationale: Skill 2.0.1 still treats raw V3.0.0 behavior as the baseline and requires
      later V3 minor/patch versions, adapters and facades to preserve it. The methodology
      patch changes only release markers and installation guidance.
    evidence:
    - skill/references/invariants.md
    - skill/references/v3-operation.md
    - docs/v3-skill-conformance-gate.md
    uncertainty: No alternative runtime implementation was tested.
  - case_id: SKILL-S-006
    disposition: separate_all_three_layers
    rationale: Package hashes and compatibility establish deterministic integrity/tuple
      facts only. They do not establish semantic readiness, human approval, migration,
      authority or host capability. The new package requires fresh review because
      its fingerprint changed; previous 2.0.0 approval is explicitly historical.
    evidence:
    - skill/SKILL.md
    - skill/references/v3-operation.md
    - skill/references/invariants.md
    - docs/v3-skill-conformance-gate.md
    uncertainty: Human review of the new fingerprint remains pending.
  - case_id: SKILL-S-007
    disposition: bounded_progressive_read_with_pinned_official_references
    rationale: 'The skill bounds reads by actor/entity/vault/scope and minimum disclosure.
      Methodology references must come from a published GitHub Release reporting immutable:
      true; its tag must resolve to the release target, the commit is pinned, and
      all package hashes are checked. A historical prepared-unreleased source marker
      does not override verified publication metadata. Vault relationships use their
      separate authorized registry.'
    evidence:
    - skill/references/v3-operation.md
    - skill/references/instantiation.md
    - skill/manifest.yaml
    - docs/v3-search-progressive-disclosure-contract.md
    - docs/v3-crud-contract.md
