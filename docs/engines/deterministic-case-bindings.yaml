schema_version: "1.0"
policy:
  purpose: "bind every matrix deterministic case to an executable validator command and observable assertion"
  semantic_limit: "bindings prove deterministic coverage, not semantic truth"
cases:
  - {id: create-valid, engine: crud, command_index: 0, assertion_id: crud.create_valid, assertion: "valid Record crosses MCP and CRUD exactly once"}
  - {id: update-versioned, engine: crud, command_index: 0, assertion_id: crud.update_versioned, assertion: "versioned update increments the Record version atomically"}
  - {id: reject-stale-write, engine: crud, command_index: 0, assertion_id: crud.reject_stale_write, assertion: "stale expected version is rejected without mutation"}
  - {id: reject-mcp-bypass, engine: crud, command_index: 1, assertion_id: crud.reject_mcp_bypass, assertion: "unsupported MCP write and direct normalizer write are blocked"}

  - {id: validate-hash, engine: artifact-provenance, command_index: 0, assertion_id: artifact.validate_hash, assertion: "artifact hash is reproducible and correctly typed"}
  - {id: monotonic-version, engine: artifact-provenance, command_index: 0, assertion_id: artifact.monotonic_version, assertion: "artifact versions do not move backwards"}
  - {id: preserve-used-version, engine: artifact-provenance, command_index: 0, assertion_id: artifact.preserve_used_version, assertion: "used artifact version is preserved when a newer version appears"}
  - {id: representation-hash-match, engine: artifact-provenance, command_index: 0, assertion_id: artifact.representation_hash_match, assertion: "representation hash matches the recorded source"}

  - {id: require-minimization, engine: ingress, command_index: 0, assertion_id: ingress.require_minimization, assertion: "processed ingress requires minimization evidence"}
  - {id: require-anonymization, engine: ingress, command_index: 0, assertion_id: ingress.require_anonymization, assertion: "sensitive ingress requires anonymization or an explicit block"}
  - {id: reject-raw-material, engine: ingress, command_index: 0, assertion_id: ingress.reject_raw_material, assertion: "raw material cannot become a Record"}
  - {id: read-is-non-mutating, engine: ingress, command_index: 0, assertion_id: ingress.read_is_non_mutating, assertion: "ingress inspection does not mutate a Record"}

  - {id: separate-queues, engine: rem-curation, command_index: 0, assertion_id: rem.separate_queues, assertion: "frontmatter, staleness and semantic findings remain in separate queues"}
  - {id: expire-ttl, engine: rem-curation, command_index: 0, assertion_id: rem.expire_ttl, assertion: "expired TTL produces a deterministic staleness finding"}
  - {id: idempotent-normalization, engine: rem-curation, command_index: 0, assertion_id: rem.idempotent_normalization, assertion: "repeating mechanical normalization yields the same result"}
  - {id: block-unsupported-queue, engine: rem-curation, command_index: 1, assertion_id: rem.block_unsupported_queue, assertion: "unsupported semantic mutation queue is blocked"}

  - {id: select-valid-chunks, engine: package, command_index: 0, assertion_id: package.select_valid_chunks, assertion: "Package selection contains only valid governed Chunks"}
  - {id: preserve-parent-context, engine: package, command_index: 0, assertion_id: package.preserve_parent_context, assertion: "partial Package retains parent Record context"}
  - {id: calculate-fingerprint, engine: package, command_index: 0, assertion_id: package.calculate_fingerprint, assertion: "Package fingerprint is reproducible from its declared inputs"}
  - {id: block-weak-destination, engine: package, command_index: 0, assertion_id: package.block_weak_destination, assertion: "Package cannot weaken destination visibility or governance"}

  - {id: require-destination-acceptance, engine: delivery-transfer, command_index: 0, assertion_id: delivery.require_destination_acceptance, assertion: "transfer requires explicit destination acceptance"}
  - {id: hold-for-rem, engine: delivery-transfer, command_index: 0, assertion_id: delivery.hold_for_rem, assertion: "unresolved material is held for REM rather than accepted"}
  - {id: block-stale-current-use, engine: delivery-transfer, command_index: 0, assertion_id: delivery.block_stale_current_use, assertion: "stale current-use material is blocked"}
  - {id: preserve-retraction-history, engine: delivery-transfer, command_index: 0, assertion_id: delivery.preserve_retraction_history, assertion: "retraction preserves history and provenance"}

  - {id: block-unauthorized-destination, engine: governance, command_index: 0, assertion_id: governance.block_unauthorized_destination, assertion: "unauthorized destination is blocked before transfer"}
  - {id: validate-profile, engine: governance, command_index: 2, assertion_id: governance.validate_profile, assertion: "vault profile declares the required entity contract"}
  - {id: detect-authority-cycle, engine: governance, command_index: 2, assertion_id: governance.detect_authority_cycle, assertion: "authority cycles are detected deterministically"}
  - {id: require-inter-entity-minimization, engine: governance, command_index: 1, assertion_id: governance.require_inter_entity_minimization, assertion: "inter-entity operation requires minimization and approval"}
  - {id: block-constitutional-exception-without-record, engine: governance, command_index: 3, assertion_id: governance.block_constitutional_exception_without_record, assertion: "constitutional contradiction without accepted Decision Record is blocked"}
  - {id: require-bounded-exception, engine: governance, command_index: 3, assertion_id: governance.require_bounded_exception, assertion: "constitutional exception requires clause, scope, risk and review condition"}
  - {id: require-rejudgment-after-amendment, engine: governance, command_index: 3, assertion_id: governance.require_rejudgment_after_amendment, assertion: "constitutional amendment marks affected rules review-required"}
  - {id: block-non-waivable-override, engine: governance, command_index: 3, assertion_id: governance.block_non_waivable_override, assertion: "non-waivable privacy and safety limits cannot be excepted"}

  - {id: redact-event, engine: operational-audit, command_index: 1, assertion_id: audit.redact_event, assertion: "operational events redact secrets and Record bodies"}
  - {id: pair-ledgers, engine: operational-audit, command_index: 0, assertion_id: audit.pair_ledgers, assertion: "operational ledgers pair inputs and outcomes"}
  - {id: reject-fingerprint-mismatch, engine: operational-audit, command_index: 0, assertion_id: audit.reject_fingerprint_mismatch, assertion: "fingerprint mismatch is an audit failure"}
  - {id: represent-inaccessible-frontier, engine: operational-audit, command_index: 0, assertion_id: audit.represent_inaccessible_frontier, assertion: "inaccessible evidence is represented without fabricated content"}

  - {id: require-source-target-version, engine: migration-compatibility, command_index: 0, assertion_id: migration.require_source_target_version, assertion: "migration requires explicit source and target versions"}
  - {id: require-rollback, engine: migration-compatibility, command_index: 0, assertion_id: migration.require_rollback, assertion: "migration proposal includes a rollback path"}
  - {id: block-raw-fallback, engine: migration-compatibility, command_index: 0, assertion_id: migration.block_raw_fallback, assertion: "raw fallback cannot bypass processed ingress"}
  - {id: preserve-v22-line, engine: migration-compatibility, command_index: 2, assertion_id: migration.preserve_v22_line, assertion: "V2.2 lineage remains traceable during V3 mapping"}

  - {id: normalize-supported-term, engine: maintenance, command_index: 2, assertion_id: maintenance.normalize_supported_term, assertion: "supported vocabulary is normalized deterministically"}
  - {id: preserve-revision, engine: maintenance, command_index: 0, assertion_id: maintenance.preserve_revision, assertion: "normalization preserves revision and provenance"}
  - {id: block-semantic-queue, engine: maintenance, command_index: 0, assertion_id: maintenance.block_semantic_queue, assertion: "mechanical maintenance cannot decide semantic queue outcomes"}
  - {id: block-direct-record-write, engine: maintenance, command_index: 0, assertion_id: maintenance.block_direct_record_write, assertion: "maintenance cannot write a Record outside CRUD"}

  - {id: sanitize-signal, engine: learning-evolution, command_index: 0, assertion_id: learning.sanitize_signal, assertion: "learning signals are sanitized before retention"}
  - {id: deduplicate-signal, engine: learning-evolution, command_index: 0, assertion_id: learning.deduplicate_signal, assertion: "repeated signals deduplicate while preserving all source references"}
  - {id: classify-known-case, engine: learning-evolution, command_index: 0, assertion_id: learning.classify_known_case, assertion: "known signal fingerprint is classified as duplicate"}
  - {id: block-unreviewed-activation, engine: learning-evolution, command_index: 0, assertion_id: learning.block_unreviewed_activation, assertion: "unreviewed learning candidate cannot activate a case"}

  - {id: reject-unauthorized-expansion, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.reject_unauthorized_expansion, assertion: "L4 expansion without explicit authorization is blocked and returns L0"}
  - {id: preserve-independent-dimensions, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.preserve_independent_dimensions, assertion: "high relevance does not upgrade unknown authority or unresolved epistemic state"}
  - {id: prose-default, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.prose_default, assertion: "default output is didactic prose and preserves material limits"}
  - {id: structured-only-on-request, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.structured_only_on_request, assertion: "separate fields are allowed only after an explicit structured request"}
  - {id: require-bounded-request-context, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.require_bounded_request_context, assertion: "missing query, entity, vault or knowledge scope is rejected"}
  - {id: block-unauthorized-vault-scope, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.block_unauthorized_vault_scope, assertion: "vault scope outside actor authorization is rejected"}
  - {id: preserve-authorized-expansion, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.preserve_authorized_expansion, assertion: "explicit authorization permits L4 without upgrading authority or epistemic status"}
  - {id: limit-stale-source, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.limit_stale_source, assertion: "stale evidence is capped at L2 and requires revalidation"}
  - {id: block-restricted-content, engine: search-progressive-disclosure, command_index: 0, assertion_id: search.block_restricted_content, assertion: "restricted content is blocked at L1 and privacy is not reported as allowed"}
