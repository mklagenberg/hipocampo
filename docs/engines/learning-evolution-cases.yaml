schema_version: "1.0"
engine: learning-evolution
policy:
  privacy: sanitized-no-real-content
  activation: "a candidate never changes a Record, contract or test suite without semantic review, Change Set and verification"
deterministic_cases:
  - id: LEARN-D-001
    use_case: normalize-sanitized-signal
    expected: stable-fingerprint-and-sanitized-envelope
  - id: LEARN-D-002
    use_case: redact-sensitive-telemetry
    expected: no-credentials-or-content-body-retained
  - id: LEARN-D-003
    use_case: deduplicate-repeated-signal
    expected: one-representative-with-all-source-refs
  - id: LEARN-D-004
    use_case: classify-known-case
    expected: duplicate
  - id: LEARN-D-005
    use_case: create-new-candidate
    expected: stable-candidate-id
  - id: LEARN-D-006
    use_case: block-unreviewed-materialization
    expected: blocked
  - id: LEARN-D-007
    use_case: reject-unsanitized-signal
    expected: blocked
  - id: LEARN-D-008
    use_case: preserve-engine-and-source-lineage
    expected: traceable
  - id: LEARN-D-009
    use_case: reject-malformed-source-reference
    expected: blocked
semantic_cases:
  - id: LEARN-S-001
    use_case: repeated-block-is-new-case-or-existing-gap
    expected_disposition: needs_review
    review_boundary: human-semantic-review
  - id: LEARN-S-002
    use_case: lesson-learned-is-bug-or-new-capability
    expected_disposition: needs_review
    review_boundary: human-semantic-review
  - id: LEARN-S-003
    use_case: false-positive-requires-contract-correction
    expected_disposition: rework_required
    review_boundary: explicit-human-decision
  - id: LEARN-S-004
    use_case: incident-requires-privacy-and-governance-impact-review
    expected_disposition: blocked
    review_boundary: host-or-human-review
