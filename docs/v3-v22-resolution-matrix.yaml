schema_version: "1.0"
status: "unreleased-v3-candidate"
authority: "decisions/0098-v3-supersession-and-v22-resolution.md"
source_release: "v2.2.0"
target_release: "v3.0.0"
policy: "V3 is sovereign; V2.2 remains readable historical input; no automatic migration"
validation:
  fixtures: "docs/v3-migration-fixtures.yaml"
  validator: "scripts/validate_v3_migration.py"
  inventory_fixtures: "docs/v3-synthetic-vault-inventories.yaml"
  inventory_validator: "scripts/validate_v3_inventory.py"

dispositions:
  - id: "0058-compatibility-contract"
    v2_problem: "Compatibility between skill, methodology, vault and access was implicit or incomplete."
    v3_resolution: "Use the V3 F0 contract and phased compatibility checks before execution, publication and migration."
    disposition: "incorporated"
    v3_authority: "docs/v3-f0-contract.md, docs/v3-f0-verification-matrix.yaml, docs/v3-contract.md"
    residual_limit: "The V3 candidate still does not establish remote authorization by declaration alone."
  - id: "0059-verification-boundaries"
    v2_problem: "Mechanical validation and human or environmental judgment were not clearly separated."
    v3_resolution: "Use typed evidence with explicit coverage, limits and human boundary."
    disposition: "superseded"
    v3_authority: "docs/v3-f0-contract.md, docs/v3-f0-verification-matrix.yaml"
    residual_limit: "Semantic truth remains outside deterministic proof."
  - id: "0060-verification-boundaries-contract"
    v2_problem: "Verification boundaries needed a durable contract instead of scattered guidance."
    v3_resolution: "Use the V3 F0 contract and evidence envelope as the governing verification boundary."
    disposition: "superseded"
    v3_authority: "docs/v3-f0-contract.md, docs/v3-f0-fixtures.yaml"
    residual_limit: "The contract does not prove external authorization."
  - id: "0061-validation-loop"
    v2_problem: "Validation needed repeatable inputs, outputs and stopping conditions."
    v3_resolution: "Use phase-specific checks and typed outcomes before proceeding."
    disposition: "superseded"
    v3_authority: "docs/v3-f0-verification-matrix.yaml, decisions/0097-v3-f0-typed-outcomes-and-contextual-blocking.md"
    residual_limit: "A passing deterministic loop does not establish semantic truth."
  - id: "0062-bounded-enforcement-policy"
    v2_problem: "Documentation could be mistaken for universal runtime enforcement."
    v3_resolution: "Declare host capability, authorization and enforcement limits explicitly."
    disposition: "superseded"
    v3_authority: "docs/v3-host-capability-matrix.yaml, docs/v3-f0-hardcode-review.yaml"
    residual_limit: "No universal runtime enforcement is claimed."
  - id: "0063-vocabulary-and-nominal-boundaries"
    v2_problem: "Vocabulary and nominal examples could create ambiguity or leak identifiable context."
    v3_resolution: "Use canonical vocabulary, aliases and structural-language/privacy boundaries."
    disposition: "superseded"
    v3_authority: "docs/v3-vocabulary-and-aliases.md, docs/v3-language-policy.md, docs/v3-license-and-vault-privacy-contract.md"
    residual_limit: "Semantic ambiguity still requires human clarification."
  - id: "0064-connector-preflight"
    v2_problem: "Connector presence was not sufficient proof of a particular read, write or remote capability."
    v3_resolution: "Classify host capabilities, authorization requirements and revocation reach per operation."
    disposition: "superseded"
    v3_authority: "docs/v3-host-capability-matrix.yaml, docs/v3-revocation-contract.md, docs/v3-f0-verification-matrix.yaml"
    residual_limit: "Remote read, write and repository creation remain untested in this workspace."
  - id: "0065-ephemeral-vault-session-view"
    v2_problem: "Context from heterogeneous vaults could be mixed or persisted unintentionally."
    v3_resolution: "Use per-vault session cache and correlation boundaries with explicit capture and destination selection."
    disposition: "superseded"
    v3_authority: "docs/v3-session-cache-contract.md, docs/v3-correlation-contract.md, docs/v3-contract.md"
    residual_limit: "The cache contract does not grant access or authority to an inaccessible vault."
  - id: "0066-contract-drift-routing"
    v2_problem: "Content, instruction, contract, version and availability drift required different responses."
    v3_resolution: "Route drift through surface authority, compatibility, evidence and migration gates."
    disposition: "superseded"
    v3_authority: "docs/v3-surface-authority-contract.md, docs/v3-external-reference-policy.md, docs/v3-f0-contract.md"
    residual_limit: "An explicit V3 drift registry and fixture cross-reference remains a preparation task."
  - id: "0067-bounded-skill-recovery"
    v2_problem: "Skill recovery could overwrite a known-good installation or accept an unverified package."
    v3_resolution: "Retain verified package, lock, rollback and human-confirmed installation as a skill procedure."
    disposition: "retained-outside-contract"
    v3_authority: "docs/skill-recovery-runbook.md, skill/manifest.yaml, skill/package-lock.yaml"
    residual_limit: "The local skill remains independently versioned and is not updated by V3 activation."
  - id: "0068-bootstrap-invitation-registration"
    v2_problem: "Bootstrap and invited-vault registration needed manifest review, confirmation and address-only registration."
    v3_resolution: "Retain address-only discovery while binding the target to V3 entity, vault role, scope, privacy and authority rules."
    disposition: "superseded"
    v3_authority: "docs/v3-contract.md, docs/v3-crud-contract.md, docs/v3-multivault-resolution-contract.md"
    residual_limit: "The complete host-specific bootstrap runbook is not part of the V3 content contract."
  - id: "0069-pending-access-fallback"
    v2_problem: "A known but inaccessible destination needed a safe provisional landing path without permission bypass."
    v3_resolution: "Use V3 privacy-first circulation, minimization, destination acceptance, processed ingress and explicit provisional or blocked states."
    disposition: "superseded"
    v3_authority: "docs/v3-policy-evaluator-contract.md, docs/v3-pre-injection-privacy-contract.md, docs/v3-processed-ingress-contract.md, docs/v3-transfer-retraction-contract.md"
    residual_limit: "No automatic cross-entity transfer or sensitive raw-material fallback is allowed."
  - id: "skill-version-independence"
    v2_problem: "Methodology and client skill releases could be mistaken for one coupled version."
    v3_resolution: "Preserve independent methodology, skill and host-adapter version tuples."
    disposition: "incorporated"
    v3_authority: "docs/v3-surface-authority-contract.md, docs/v3-contract.md"
    residual_limit: "The V3 release tuple and required skill version still need final LTE declaration."
  - id: "validation-fixtures-and-regression"
    v2_problem: "New safety boundaries needed repeatable positive and negative checks."
    v3_resolution: "Retain V2.2 fixtures as regression inputs and use V3 fixtures for the stronger contract."
    disposition: "incorporated"
    v3_authority: "docs/v3-f0-fixtures.yaml, docs/v3-crud-fixtures.yaml, docs/v3-artifact-fixtures.yaml"
    residual_limit: "Fixtures do not prove real remote authorization or semantic truth."
  - id: "v22-release-line-metadata"
    v2_problem: "The published v2.2.0 release and its canonical files describe the active methodology contract inconsistently."
    v3_resolution: "Keep the historical tag immutable; resolve the release-line interpretation before final V3 metadata is declared."
    disposition: "incorporated"
    v3_authority: "decisions/0098-v3-supersession-and-v22-resolution.md, decisions/0101-v22-release-line-metadata-correction.md, README.md, SPEC.md, COMPATIBILITY.yaml, CHANGELOG.md"
    residual_limit: "The historical v2.2.0 tag remains immutable; the V3 release tuple and final LTE publication still require their own release gate."
  - id: "v22-migration-documentation"
    v2_problem: "V2.2-specific migration implications were not mapped into the V3 migration guide."
    v3_resolution: "Add a candidate 2.x to 3.0 migration boundary with mapping, rollback, privacy and approval gates."
    disposition: "incorporated"
    v3_authority: "MIGRATIONS.md, docs/v3-crosswalk-v2-v3.yaml, docs/v3-f0-verification-matrix.yaml"
    residual_limit: "No real vault has been inventoried or migrated."
