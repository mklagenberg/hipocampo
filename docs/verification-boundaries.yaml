schema_version: "1.0"
purpose: "Declare the proof boundary of each deterministic verification surface."
entries:
  - id: repository-structure
    mechanism: scripts/validate_hipocampo.py
    inputs: repository markdown, frontmatter, links, and required files
    outputs: structural errors and warnings
    coverage: schema, links, and repository-contract invariants
    rule_revision: "1.0"
    legacy_treatment: validates the current corpus; historical exceptions remain explicit
    limits: cannot prove semantic completeness, truth, or author intent
    human_or_environmental_boundary: semantic review and operator acceptance
  - id: declared-contracts
    mechanism: scripts/validate_contracts.py
    inputs: SPEC.md, manifests, and named contract surfaces
    outputs: cross-surface consistency result
    coverage: required declarations and version synchronization
    rule_revision: "1.0"
    legacy_treatment: protected paths are checked; legacy prose is not rewritten automatically
    limits: text presence is not semantic sufficiency
    human_or_environmental_boundary: contract interpretation and change approval
  - id: skill-package
    mechanism: scripts/validate_skill_package.py
    inputs: skill files and skill/package-lock.yaml
    outputs: file-set and hash result
    coverage: package completeness and raw SHA-256 integrity
    rule_revision: "1.0"
    legacy_treatment: package lock is authoritative for the candidate package
    limits: hashes do not prove instruction safety or runtime behavior
    human_or_environmental_boundary: skill review, installation, and host execution
  - id: compatibility
    mechanism: scripts/validate_compatibility.py
    inputs: COMPATIBILITY.yaml, package lock, and optional vault manifest
    outputs: compatibility state and validation errors
    coverage: declared methodology/skill/vault tuple, hashes, and known states
    rule_revision: "1.0"
    legacy_treatment: unknown or missing legacy fields block rather than get inferred
    limits: cannot reach remote sources or decide semantic authority
    human_or_environmental_boundary: access restoration, migration, and operator acceptance
  - id: change-set
    mechanism: scripts/validate_change.py
    inputs: changes/* and protected repository paths
    outputs: Change Set schema and coverage result
    coverage: required metadata, links, and protected-path heuristics
    rule_revision: "1.0"
    legacy_treatment: existing Change Sets are checked without retroactive normalization
    limits: impact statements may be inaccurate despite passing structure
    human_or_environmental_boundary: semantic impact review and publication decision
  - id: skill-documentation
    mechanism: scripts/validate_skill_docs.py
    inputs: skill instructions and scaffold references
    outputs: documentation consistency result
    coverage: declared output paths and superseded-field references
    rule_revision: "1.0"
    legacy_treatment: legacy aliases remain readable where explicitly documented
    limits: cannot execute host adapters or prove user-facing behavior
    human_or_environmental_boundary: host-specific runtime verification
  - id: provenance-presence
    mechanism: human/source-specific verification
    inputs: declared sources, hashes, and release references
    outputs: presence and lineage assessment
    coverage: reference presence and reproducible pointer checks
    rule_revision: "1.0"
    legacy_treatment: unavailable sources remain marked unavailable
    limits: presence is not authenticity, freshness, or truth
    human_or_environmental_boundary: independent source retrieval and judgment
  - id: destructive-action-enforcement
    mechanism: host-specific capability
    inputs: proposed operation, scope, authorization, and environment state
    outputs: allow, deny, or blocked-unavailable before execution
    coverage: only adapters that expose a pre-execution barrier
    rule_revision: "1.0"
    legacy_treatment: absence of an adapter is a block/limitation, never an allow
    limits: no repository-wide universal runtime barrier is claimed
    human_or_environmental_boundary: host enforcement and explicit authorization
  - id: validation-revalidation-loop
    mechanism: scripts/validate_validation_loop.py
    inputs: failure record, authoritative contract, correction scope, and regression result
    outputs: revalidate or stop decision
    coverage: bounded correction sequence and explicit escalation conditions
    rule_revision: "1.0"
    legacy_treatment: does not rewrite historical failures or infer missing evidence
    limits: cannot decide semantic truth or policy intent
    human_or_environmental_boundary: scope change, authority, and host decision
  - id: bounded-enforcement-policy
    mechanism: scripts/validate_enforcement_policy.py
    inputs: synthetic operation, authorization, and adapter availability
    outputs: allow, deny, or blocked-unavailable simulation
    coverage: four declared pre-execution policy classes
    rule_revision: "1.0"
    legacy_treatment: absent adapter blocks; it is never treated as permission
    limits: simulation does not intercept a real operation
    human_or_environmental_boundary: host adapter enforcement
  - id: nominal-citation-review
    mechanism: scripts/validate_nominal_citations.py
    inputs: explicitly supplied new or changed text files
    outputs: non-placeholder handle findings
    coverage: bounded @handle heuristic with an explicit allowlist
    rule_revision: "1.0"
    legacy_treatment: legacy corpus is not scanned or rewritten automatically
    limits: handles are not identity proof; heuristic can miss or flag text
    human_or_environmental_boundary: human identity and source review
  - id: connector-preflight
    mechanism: scripts/validate_connector_preflight.py
    inputs: host, identity, target, operation and observed evidence
    outputs: observed, blocked, or not-tested capability state
    coverage: six declared local and remote operation classes
    rule_revision: "1.0"
    legacy_treatment: unavailable or untested capabilities remain blocked
    limits: local observation is not remote authorization
    human_or_environmental_boundary: connector and explicit human authorization
  - id: ephemeral-vault-session-view
    mechanism: scripts/validate_vault_session_view.py
    inputs: session-view contract and heterogeneous-vault fixtures
    outputs: transient isolation and blocking assessment
    coverage: target ambiguity, incompatibility and context isolation
    rule_revision: "1.0"
    legacy_treatment: no historical session state is rewritten
    limits: validator does not provide runtime session memory
    human_or_environmental_boundary: host/session adapter and target authority
  - id: contract-drift-routing
    mechanism: scripts/validate_contract_drift.py
    inputs: drift classifications and declared actions
    outputs: deterministic routing assessment
    coverage: five contract-drift classes
    rule_revision: "1.0"
    legacy_treatment: historical contracts are not migrated automatically
    limits: cannot determine semantic sufficiency of a new contract
    human_or_environmental_boundary: human review and authoritative contract
  - id: skill-recovery
    mechanism: scripts/validate_skill_recovery.py
    inputs: recovery failure surfaces and rollback fixtures
    outputs: bounded recovery coverage
    coverage: missing, unexpected, interrupted and unverifiable package states
    rule_revision: "1.0"
    legacy_treatment: known-good installation is preserved
    limits: no remote release or credential validation
    human_or_environmental_boundary: host package manager and authorization
  - id: bootstrap-invitation
    mechanism: scripts/validate_bootstrap_invitation.py
    inputs: onboarding procedure and invitation fixtures
    outputs: confirmation and compatibility gate assessment
    coverage: create, manual fallback, inaccessible, incompatible and no-write paths
    rule_revision: "1.0"
    legacy_treatment: no vault content is copied during registration
    limits: does not execute remote invitations or repository creation
    human_or_environmental_boundary: connector authority and human confirmation
  - id: pending-access-fallback
    mechanism: scripts/validate_access_fallback.py
    inputs: access failure and fallback fixtures
    outputs: diagnosis and sensitive-transfer blocking assessment
    coverage: seven pending-access and fallback classes
    rule_revision: "1.0"
    legacy_treatment: no legacy content is promoted or declassified
    limits: hierarchy and confidentiality policy remain unresolved
    human_or_environmental_boundary: human authorization and MRL-0004 policy
  - id: semantic-fixtures
    mechanism: scripts/validate_semantic_fixtures.py
    inputs: docs/v3-semantic-fixtures.yaml
    outputs: fixture-envelope errors or structural success
    coverage: epistemic, maturity, provenance, conflict, and access-boundary cases
    rule_revision: "1.0"
    legacy_treatment: no external corpus is copied or rewritten
    limits: cannot judge semantic truth, authority, freshness, or production behavior
    human_or_environmental_boundary: semantic review, research, and explicit human decision
  - id: v3-crud-contract
    mechanism: scripts/validate_v3_crud.py
    inputs: docs/v3-crud-fixtures.yaml and in-memory Record/Chunk/Collection/Artifact/Package objects
    outputs: contract allow/block result
    coverage: identity, parent context, Collections, monotonic restrictions, partial Packages, and Artifact versioning
    rule_revision: "v3.0.0-1"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: cannot prove remote transport, authorization, migration safety, or runtime enforcement
    human_or_environmental_boundary: vault adapter, migration review, and human publication gate
  - id: v3-artifact-contract
    mechanism: scripts/validate_v3_artifacts.py
    inputs: docs/v3-artifact-fixtures.yaml and in-memory Artifact/Record representations
    outputs: Artifact contract allow/block result
    coverage: material representation, version/hash integrity, accessibility, privacy monotonicity, external references, and reconstruction
    rule_revision: "v3.0.0-2"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: cannot fetch external objects, prove authorization or truth, perform transcription, migrate vaults, or enforce runtime access
    human_or_environmental_boundary: source access, semantic adequacy, migration review, connector policy, and human publication gate
  - id: v3-l4r-ledger-audit
    mechanism: scripts/v3_audit_engine.py
    inputs: local vault snapshots, Records, Packages, and packages-sent/packages-received ledger entries
    outputs: coverage, integrity, circulation, governance, verified nodes, frontiers, and deterministic findings
    coverage: logical authority snapshot, bilateral pairing, fingerprints, selected content references, inaccessible frontiers, and backward/forward circulation
    rule_revision: "v3.0.0-3"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: cannot prove semantic truth, remote authorization, transport security, host permissions, or human semantic correctness
    human_or_environmental_boundary: REM, semantic conciliation, destination acceptance, privacy policy, and human publication gate
  - id: v3-x4-policy-evaluator
    mechanism: scripts/v3_policy_engine.py
    inputs: source policy, destination policy, purpose, visibility, and boundary context
    outputs: explainable permitido/redigido/provisório/bloqueado result
    coverage: independent origin/destination authorization, redaction, provisional semantic state, and fail-closed objective boundaries
    rule_revision: "v3.0.0-4"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: cannot decide semantic truth or enforce a remote host boundary
    human_or_environmental_boundary: policy ownership, semantic judgment, remote authorization, and publication gate
  - id: v3-x4-multivault-resolution
    mechanism: scripts/v3_multivault_engine.py
    inputs: vault graph, typed relations, authorities, and accessible frontier
    outputs: visible graph, coverage, cycles, collisions, and privacy-bounded findings
    coverage: typed relations, hereditary cycles, authority collisions, and inaccessible frontiers
    rule_revision: "v3.0.0-5"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: cannot grant access, select semantic truth, or authorize remote transport
    human_or_environmental_boundary: vault access, entity contract, semantic conciliation, and operator authorization
  - id: v3-x4-transfer-retraction
    mechanism: scripts/v3_transfer_engine.py
    inputs: Package, source/destination policies, receipt, REM result, and retraction control data
    outputs: delivery, pending/current receipt, or additive retraction event
    coverage: separation of delivery/publication, REM gate, current-use state, and history-preserving tombstone
    rule_revision: "v3.0.0-6"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: does not transport, migrate, delete history, or prove semantic acceptance
    human_or_environmental_boundary: destination acceptance, REM, semantic review, and publication gate
  - id: v3-x4-privacy-gate
    mechanism: scripts/v3_privacy_gate.py
    inputs: passage, identity, destination, purpose, minimization, restrictions, and environment authorization
    outputs: passage-level allow/block decisions without content duplication
    coverage: retrieval, compilation, injection, export, cache, embedding, telemetry, and external processing
    rule_revision: "v3.0.0-7"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: cannot guarantee host security or decide semantic truth
    human_or_environmental_boundary: host enforcement, external provider contract, privacy policy, and human review
  - id: v3-x4-processed-ingress
    mechanism: scripts/v3_ingress_engine.py
    inputs: destination-bound content, authorized environment, approvals, and queue findings
    outputs: minimized/redacted local new/pending_rem representation and separated findings
    coverage: no raw inbox, READ no-write, redaction, declassification approval, REM double check, and three queues
    rule_revision: "v3.0.0-8"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: cannot prove semantic adequacy or replace REM/human curation
    human_or_environmental_boundary: destination boundary, processing environment, REM, semantic review, and approval
  - id: v3-x4-profile-audit
    mechanism: scripts/v3_profile_engine.py
    inputs: scoped profile links, actor role, audit event, and vault boundary
    outputs: accepted/revoked profile result and additive local audit event
    coverage: role separation, expiry, revocation, local violation record, authorization, and correction linkage
    rule_revision: "v3.0.0-9"
    legacy_treatment: v2 instances remain readable and are not migrated
    limits: does not replace Git, host permissions, or semantic governance
    human_or_environmental_boundary: vault membership, Git versioning, operator authorization, and closure decision
