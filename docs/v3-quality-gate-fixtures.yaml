dual_capabilities:
- id: canonical-record-mutation
  mode: dual
  invariants:
  - authorization
  - semantic-review-gate
  - structure
  - expected-version
  - idempotency
  - canonical-write-boundary
  vectors:
  - id: valid-create
    semantic_fixture_ref: v3-crud-use-case-fixtures.yaml#UC-CRUD-03-valid-create
    semantic_expected: allow
    deterministic_case_key: matrix:crud/reject-mcp-bypass
    deterministic_expected: allow
  - id: invalid-structure
    semantic_fixture_ref: v3-crud-use-case-fixtures.yaml#UC-CRUD-04-invalid-structure
    semantic_expected: block
    deterministic_case_key: matrix:crud/reject-mcp-bypass
    deterministic_expected: block
  - id: stale-update
    semantic_fixture_ref: v3-crud-use-case-fixtures.yaml#UC-CRUD-13-stale-current-use
    semantic_expected: block
    deterministic_case_key: matrix:crud/reject-stale-write
    deterministic_expected: block
  - id: incomplete-semantic-review
    semantic_fixture_ref: v3-crud-use-case-fixtures.yaml#UC-CRUD-05-incomplete-semantic-review
    semantic_expected: needs-review
    deterministic_case_key: matrix:crud/reject-mcp-bypass
    deterministic_expected: block
    justified_difference: Semantic route labels the need for review; deterministic
      contract route blocks an incomplete review envelope.
  justified_differences:
  - Semantic truth remains reviewer judgment; deterministic route proves reproducible
    contract properties. Review-needed and blocked are distinct route outcomes when
    the deterministic envelope is incomplete.
- id: semantic-curation-review
  mode: semantic-only
  rationale: Meaning, authority, conflict and relevance require contextual judgment;
    no deterministic substitute is claimed.
